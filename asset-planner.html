<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>富時代｜尊榮資產規劃報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* --- 核心變數與基礎設定 --- */
:root {
    --gold-primary: #c9922b;
    --gold-light: #f5d87a;
    --bg-dark: #050a14;
    --bg-card: rgba(15, 30, 48, 0.7);
    --text-main: #e0d7c8;
    --text-dim: #7a9ab8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

body {
    background: radial-gradient(circle at 50% 50%, #0d1f35 0%, var(--bg-dark) 100%);
    color: var(--text-main);
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
}

/* --- 質感動畫 --- */
@keyframes shine { to { background-position: 200% center; } }
@keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
@keyframes glow { 0% { box-shadow: 0 0 5px rgba(201, 146, 43, 0.2); } 50% { box-shadow: 0 0 20px rgba(201, 146, 43, 0.4); } 100% { box-shadow: 0 0 5px rgba(201, 146, 43, 0.2); } }

/* --- 導航列 --- */
.tb {
    background: rgba(10, 24, 40, 0.8);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(201, 146, 43, 0.3);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 999;
}

.logo-circle {
    width: 38px; height: 38px;
    border: 1.5px solid var(--gold-primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-primary);
    font-weight: 900;
    box-shadow: 0 0 15px rgba(201, 146, 43, 0.2);
    animation: glow 3s infinite;
}

/* --- 卡片通用樣式 --- */
.card, .section-box {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(201, 146, 43, 0.15);
    border-radius: 16px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

.card:hover {
    border-color: rgba(201, 146, 43, 0.4);
    transform: translateY(-3px);
}

.card-header {
    background: linear-gradient(90deg, rgba(201,146,43,0.1), transparent);
    padding: 14px 20px;
    border-bottom: 1px solid rgba(201,146,43,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
}

.card-idx {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gold-primary);
    border: 1px solid var(--gold-primary);
    padding: 2px 6px;
    border-radius: 4px;
}

/* --- 輸入組件 --- */
.fl label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
}

.fl input, .fl select {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 12px;
    color: #fff;
    font-size: 14px;
    transition: all 0.3s;
}

.fl input:focus {
    background: rgba(201, 146, 43, 0.05);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px rgba(201, 146, 43, 0.2);
    outline: none;
}

/* --- 高質感按鈕 --- */
.btn-gold {
    background: linear-gradient(135deg, #c9922b 0%, #f5d87a 50%, #c9922b 100%);
    background-size: 200% auto;
    animation: shine 4s linear infinite;
    border: none;
    border-radius: 12px;
    padding: 16px;
    color: #050a14;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 5px 25px rgba(201, 146, 43, 0.4);
    transition: transform 0.2s;
}

.btn-gold:active { transform: scale(0.98); }

/* --- 報告數值亮點 --- */
.highlight-val {
    font-family: 'DM Mono', monospace;
    font-weight: 900;
    background: linear-gradient(to bottom, #fff, var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(245, 216, 122, 0.3));
}

/* --- 載入遮罩 --- */
#loader {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: #050a14; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}

.spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(201, 146, 43, 0.1);
    border-top: 3px solid var(--gold-primary);
    border-radius: 50%;
    animation: spin 1s infinite linear;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* --- 媒體查詢 --- */
@media (max-width: 600px) {
    .main { padding: 15px; }
    .g2 { grid-template-columns: 1fr !important; }
}
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: var(--gold-primary); letter-spacing: 4px; font-size: 12px;">系統初始化中...</p>
</div>

<div class="tb">
    <div style="display:flex; align-items:center; gap:12px;">
        <div class="logo-circle">富</div>
        <div>
            <div style="font-weight:900; color:var(--gold-light); letter-spacing:1px; font-size:15px;">富時代資產顧問</div>
            <div style="font-size:9px; color:var(--text-dim); letter-spacing:2px;">WEALTH PLANNING SYSTEM</div>
        </div>
    </div>
    <div style="display:flex; gap:8px;">
        <button id="tabI" class="btn-gold" style="padding: 6px 15px; font-size: 11px; box-shadow:none;" onclick="showPage('input')">輸入</button>
        <button id="tabR" class="btn-gold" style="padding: 6px 15px; font-size: 11px; box-shadow:none; opacity:0.6" onclick="showPage('report')">分析</button>
    </div>
</div>

<main class="main" style="max-width: 650px; margin: 0 auto; padding: 20px;">
    
    <div id="pageInput">
        <div class="card">
            <div class="card-header"><span class="card-idx">01</span><span style="font-weight:700;">基礎財務模型</span></div>
            <div class="cb" style="padding: 20px; display: grid; gap: 20px;">
                <div class="fl">
                    <label>客戶姓名</label>
                    <input type="text" id="iName" placeholder="輸入尊姓大名">
                </div>
                <div class="g2" style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="fl">
                        <label>目前月收入 (萬)</label>
                        <input type="number" id="iInc" value="10">
                    </div>
                    <div class="fl">
                        <label>目前月支出 (萬)</label>
                        <input type="number" id="iExp" value="5">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span class="card-idx">02</span><span style="font-weight:700;">目標物件參數</span></div>
            <div class="cb" style="padding: 20px;">
                <div class="fl" style="margin-bottom: 20px;">
                    <label>物件總價 (萬)</label>
                    <input type="number" id="iPrc" value="2000" style="font-size: 18px; color: var(--gold-light); font-weight:bold;">
                </div>
                <div class="g2" style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="fl">
                        <label>貸款成數 (%)</label>
                        <input type="number" id="iLtv" value="80">
                    </div>
                    <div class="fl">
                        <label>房貸年利率 (%)</label>
                        <input type="number" id="iRate" value="2.15" step="0.01">
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-gold" style="width: 100%; font-size: 16px;" onclick="generateReport()">生成精準規劃報告</button>
    </div>

    <div id="pageReport" style="display:none;">
        <div class="section-box" style="padding: 30px; text-align: center; border: 2px solid var(--gold-primary);">
            <div style="font-size: 10px; color: var(--gold-primary); letter-spacing: 5px; margin-bottom: 10px;">EXECUTIVE SUMMARY</div>
            <h1 id="rName" style="font-size: 28px; margin-bottom: 15px;">王小明 先生/小姐</h1>
            <div style="width: 50px; height: 1px; background: var(--gold-primary); margin: 0 auto 20px;"></div>
            <p style="color: var(--text-dim); font-style: italic;">「根據您的財務現況，這不僅是一份購屋試算，更是一次資產結構的重新定義。」</p>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div class="card" style="padding: 20px; text-align:center;">
                <div style="font-size:10px; color: var(--text-dim); margin-bottom: 10px;">預估月還款額</div>
                <div id="rMonthly" class="highlight-val" style="font-size: 26px;">—</div>
                <div style="font-size:10px; color: var(--text-dim); margin-top: 5px;">台幣 / 月</div>
            </div>
            <div class="card" style="padding: 20px; text-align:center;">
                <div style="font-size:10px; color: var(--text-dim); margin-bottom: 10px;">房貸所得比</div>
                <div id="rRatio" class="highlight-val" style="font-size: 26px;">—</div>
                <div style="font-size:10px; color: var(--text-dim); margin-top: 5px;">建議 30% 以下</div>
            </div>
        </div>

        <div class="card" style="padding: 20px;">
            <div style="font-size: 11px; color: var(--gold-primary); font-weight: bold; margin-bottom: 15px;">十年資產投影對比</div>
            <canvas id="assetChart" style="max-height: 250px;"></canvas>
        </div>

        <div id="verdictBox" class="card" style="padding: 20px; background: linear-gradient(135deg, rgba(46,204,113,0.1), transparent); border-color: #2ecc71;">
            <h3 style="color: #2ecc71; margin-bottom: 10px;">顧問結論</h3>
            <p id="rVerdict" style="line-height: 1.8; color: #fff;">分析計算中...</p>
        </div>

        <button class="btn-gold" style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; box-shadow: none;" onclick="showPage('input')">返回修改參數</button>
    </div>

</main>

<script>
// --- 初始化 ---
window.onload = () => {
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
    }, 1000);
};

let chartInstance = null;

function showPage(page) {
    document.getElementById('pageInput').style.display = page === 'input' ? 'block' : 'none';
    document.getElementById('pageReport').style.display = page === 'report' ? 'block' : 'none';
    document.getElementById('tabI').style.opacity = page === 'input' ? '1' : '0.6';
    document.getElementById('tabR').style.opacity = page === 'report' ? '1' : '0.6';
}

function generateReport() {
    // 獲取數值
    const name = document.getElementById('iName').value || '貴賓';
    const inc = parseFloat(document.getElementById('iInc').value) * 10000;
    const prc = parseFloat(document.getElementById('iPrc').value) * 10000;
    const ltv = parseFloat(document.getElementById('iLtv').value) / 100;
    const rate = parseFloat(document.getElementById('iRate').value) / 100 / 12;
    const months = 30 * 12;

    // PMT 公式
    const loan = prc * ltv;
    const monthlyPay = (loan * rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
    const ratio = (monthlyPay / inc) * 100;

    // 填充數據
    document.getElementById('rName').textContent = name + ' 尊鑒';
    document.getElementById('rMonthly').textContent = Math.round(monthlyPay).toLocaleString();
    document.getElementById('rRatio').textContent = ratio.toFixed(1) + '%';

    // 結論邏輯
    let verdict = "";
    if (ratio < 35) {
        verdict = "您的財務防火牆極其穩固。購屋後的房貸支出佔比優異，仍具備高度的資金靈活性，建議可以大膽布局優質資產。";
        document.getElementById('verdictBox').style.borderColor = "#2ecc71";
    } else if (ratio < 50) {
        verdict = "目前方案處於適中區間。購屋後生活品質不變，但建議預留 6-12 個月的緊急預備金，以應對未來的升息環境。";
        document.getElementById('verdictBox').style.borderColor = "#c9922b";
    } else {
        verdict = "警示：房貸佔比過高。這可能會擠壓您的生活品質與其他投資空間，建議調低目標總價或增加自備款比例。";
        document.getElementById('verdictBox').style.borderColor = "#e05c4a";
    }
    document.getElementById('rVerdict').textContent = verdict;

    showPage('report');
    renderChart(prc);
}

function renderChart(initialPrc) {
    const ctx = document.getElementById('assetChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const years = [0, 2, 4, 6, 8, 10];
    const assetData = years.map(y => (initialPrc * Math.pow(1.03, y)) / 10000); // 假設每年 3% 增值

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: years.map(y => '第 ' + y + ' 年'),
            datasets: [{
                label: '預估房屋市值 (萬)',
                data: assetData,
                borderColor: '#c9922b',
                backgroundColor: 'rgba(201, 146, 43, 0.1)',
                fill: true,
                tension: 0.4,
                borderWidth: 3,
                pointBackgroundColor: '#f5d87a'
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#7a9ab8' } },
                x: { grid: { display: false }, ticks: { color: '#7a9ab8' } }
            }
        }
    });
}
</script>

</body>
</html>
