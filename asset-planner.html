<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>富時代｜資產規劃報告 Pro</title>
<style>
  :root { --gold: #c9922b; --dark-bg: #08111e; --card-bg: rgba(255,255,255,0.03); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark-bg);color:#d4c9b8;font-family:'Noto Serif TC',serif;font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.6}
  
  /* Header */
  .tb{background:linear-gradient(135deg,#0a1828,#0d1f35);border-bottom:1px solid rgba(201,146,43,.4);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;box-shadow:0 4px 30px rgba(0,0,0,0.5)}
  .logo-text { font-weight: 900; letter-spacing: 2px; color: var(--gold); font-size: 1.2rem; }

  .container{max-width:960px;margin:20px auto;padding:0 15px}
  .section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: var(--gold); border-left: 4px solid var(--gold); padding-left: 12px; }
  
  .card{background:var(--card-bg);border:1px solid rgba(201,146,43,0.15);border-radius:16px;padding:25px;margin-bottom:25px;backdrop-filter:blur(10px)}

  /* Input Grid */
  .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .field { position: relative; }
  label { display: block; margin-bottom: 8px; color: #8e8271; font-size: 0.85rem; font-weight: 700; }
  input { width: 100%; background: #0c1a2b; border: 1px solid #1f3550; border-radius: 8px; padding: 14px; color: #fff; font-family: 'DM Mono', monospace; font-size: 1rem; transition: 0.3s; }
  input:focus { border-color: var(--gold); outline: none; background: #13263d; box-shadow: 0 0 10px rgba(201,146,43,0.2); }

  /* 報告核心區：衝動感佈局 */
  .report-hero { text-align: center; padding: 45px 20px; border: 2px solid var(--gold); background: linear-gradient(180deg, rgba(201,146,43,0.12) 0%, transparent 100%); border-radius: 20px; margin-bottom: 30px; }
  .hero-label { color: var(--gold); font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; }
  .hero-value { font-size: 4rem; font-weight: 900; color: #fff; margin: 15px 0; text-shadow: 0 0 30px rgba(201,146,43,0.4); font-family: 'DM Mono'; }
  .hero-value span { font-size: 1.4rem; margin-left: 8px; color: var(--gold); }
  .hero-desc { color: #d4c9b8; font-size: 1rem; opacity: 0.8; max-width: 600px; margin: 0 auto; }

  /* 數據方塊 */
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
  .stat-card { background: rgba(0,0,0,0.3); padding: 22px; border-radius: 12px; border-top: 3px solid var(--gold); }
  .stat-label { font-size: 0.9rem; color: #8e8271; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .stat-num { font-size: 1.8rem; font-family: 'DM Mono'; font-weight: 700; color: #fff; }
  .stat-num.red { color: #ff6b6b; }
  .stat-hint { font-size: 0.75rem; color: #666; margin-top: 8px; }

  /* 診斷話術 */
  .verdict { padding: 25px; border-radius: 12px; font-size: 1.15rem; line-height: 1.8; margin-top: 20px; position: relative; overflow: hidden; }
  .verdict::before { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 6px; }
  .gs { background: rgba(39,174,96,0.1); color: #a2f1c3; } .gs::before { background: #27ae60; }
  .gr { background: rgba(224,107,107,0.1); color: #ffb1a8; } .gr::before { background: #ff6b6b; }
  .gw { background: rgba(201,146,43,0.1); color: #f5d87a; } .gw::before { background: var(--gold); }

  /* Chart */
  .chart-container { position: relative; height: 380px; width: 100%; margin-top: 30px; }

  /* 按鈕 */
  .btn-sync { background: var(--gold); color: #08111e; border: none; padding: 18px 40px; border-radius: 50px; font-weight: 900; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1.2rem; margin-top: 30px; text-transform: uppercase; letter-spacing: 1px; }
  .btn-sync:hover { background: #e5a93d; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(201,146,43,0.4); }
  .btn-sync:disabled { background: #444; color: #888; cursor: not-allowed; }

  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: 1fr; }
    .hero-value { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="tb">
  <div class="logo-text">富時代｜ASSET PLANNER</div>
</div>

<div class="container">
  <div class="section-title">Step 1. 財務現況輸入</div>
  <div class="card">
    <div class="input-grid">
      <div class="field"><label>每月總收入 (薪資/獎金)</label><input type="number" id="salary" value="100000" oninput="calc()"></div>
      <div class="field"><label>每月生活開銷</label><input type="number" id="expense" value="35000" oninput="calc()"></div>
      <div class="field"><label>目前每月租金</label><input type="number" id="rent" value="25000" oninput="calc()"></div>
      <div class="field"><label>可動用自備款</label><input type="number" id="downPayment" value="3500000" oninput="calc()"></div>
      <div class="field"><label>目標購屋總價</label><input type="number" id="targetPrice" value="18000000" oninput="calc()"></div>
      <div class="field"><label>預計貸款年限 (年)</label><input type="number" id="loanYear" value="30" oninput="calc()"></div>
    </div>
  </div>

  <div class="section-title">Step 2. 資產增值診斷報告</div>
  <div id="reportSection" class="card" style="background: #0c1a2b;">
    
    <div class="report-hero">
      <div class="hero-label">10 年後的財富階級差距</div>
      <div id="projDiff" class="hero-value">0<span>萬</span></div>
      <div class="hero-desc">這是「現在進場」與「持續觀望」在十年後產生的淨資產落差。</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">猶豫的隱形成本 (年) <span style="color:#ff6b6b">LOSS</span></div>
        <div id="waitYearly" class="stat-num red">$0</div>
        <div class="stat-hint">包含預期房價漲幅與白付出的租金</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">日均資產流失 (日) <span style="color:#ff6b6b">DRAIN</span></div>
        <div id="waitDaily" class="stat-num red">$0</div>
        <div class="stat-hint">您每考慮一天，資產相對流失的金額</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card" style="border-top-color: #27ae60;">
        <div class="stat-label">10年後【有房】總淨資產</div>
        <div id="buy10" class="stat-num">$0</div>
      </div>
      <div class="stat-card" style="border-top-color: #8e8271;">
        <div class="stat-label">10年後【無房】總淨資產</div>
        <div id="nobuy10" class="stat-num">$0</div>
      </div>
    </div>

    <div id="vdBox" class="verdict gw">
      正在計算您的財富路徑...
    </div>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>

    <button id="syncBtn" class="btn-sync" onclick="syncToCRM()">✅ 確認同步報告至 CRM 系統</button>
    <div id="syncMsg" style="text-align:center; margin-top:15px; font-weight:700;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const g = (id) => document.getElementById(id);
let myChart = null;

function format(n) { return n.toLocaleString(); }

function calc() {
  // 1. 取得數據並防呆
  const salary = Math.max(0, parseFloat(g('salary').value) || 0);
  const expense = Math.max(0, parseFloat(g('expense').value) || 0);
  const rent = Math.max(0, parseFloat(g('rent').value) || 0);
  const downPayment = Math.max(0, parseFloat(g('downPayment').value) || 0);
  const targetPrice = Math.max(0, parseFloat(g('targetPrice').value) || 0);
  const loanYear = Math.max(1, parseFloat(g('loanYear').value) || 30);
  const loanRate = 0.021; // 預設 2.1%

  // 2. 房貸月付金計算 (本息平均攤還)
  const loanAmount = Math.max(0, targetPrice - downPayment);
  const monthlyRate = loanRate / 12;
  const totalMonths = loanYear * 12;
  let monthlyMortgage = 0;
  if (loanAmount > 0) {
    monthlyMortgage = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
  }

  // 3. 核心衝動邏輯：等待代價 (房價年漲 3.5% + 租金)
  const growthRate = 0.035;
  const yearlyWaitLoss = (targetPrice * growthRate) + (rent * 12);
  const dailyWaitLoss = yearlyWaitLoss / 365;

  // 4. 十年投影 (買房 vs 觀望投資)
  // A. 買房：房產增值 + 已償還本金
  const houseValue10y = targetPrice * Math.pow(1 + growthRate, 10);
  const remainingLoan10y = loanAmount * (Math.pow(1 + monthlyRate, totalMonths) - Math.pow(1 + monthlyRate, 120)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
  const buy10Asset = houseValue10y - remainingLoan10y + (salary - expense - monthlyMortgage) * 120 * 0.5;

  // B. 觀望：自備款 4% 投資 + 剩餘現金流
  const investRate = 0.04;
  const noBuy10Asset = (downPayment * Math.pow(1 + investRate, 10)) + (salary - expense - rent) * 120 * 0.5;

  const diff = buy10Asset - noBuy10Asset;

  // 5. 更新 UI
  g('projDiff').innerHTML = `${format(Math.round(diff/10000))}<span>萬</span>`;
  g('waitYearly').textContent = `$${format(Math.round(yearlyWaitLoss))}`;
  g('waitDaily').textContent = `$${format(Math.round(dailyWaitLoss))}`;
  g('buy10').textContent = `$${format(Math.round(buy10Asset/10000))} 萬`;
  g('nobuy10').textContent = `$${format(Math.round(noBuy10Asset/10000))} 萬`;

  // 6. 診斷話術
  const ratio = salary > 0 ? (monthlyMortgage / salary) : 0;
  updateVerdict(ratio, diff, yearlyWaitLoss);

  // 7. 更新圖表
  updateChart(buy10Asset, noBuy10Asset);
}

function updateVerdict(ratio, diff, loss) {
  let box = g('vdBox');
  if (ratio > 0.5) {
    box.className = "verdict gr";
    box.innerHTML = `⚠️ <b>負擔預警：</b>目前房貸支出佔收入 ${(ratio*100).toFixed(1)}%，壓力較大。建議評估拉長貸款年限或調整目標總價，以確保資產穩健成長。`;
  } else if (diff > 0) {
    box.className = "verdict gs";
    box.innerHTML = `🚀 <b>黃金機會：</b>數據顯示現在進場，10 年後將多累積 <b>${format(Math.round(diff/10000))} 萬</b> 的財富淨值。您每猶豫一年，就相當於虧損了 <b>${format(Math.round(loss))} 元</b> 的潛在價值。`;
  } else {
    box.className = "verdict gw";
    box.innerHTML = `💡 <b>配置建議：</b>目前適合持續觀望並優化資產結構。建議將資金投入穩健標的，待自備款更充裕時再行進場。`;
  }
}

function updateChart(buy, nobuy) {
  const ctx = g('myChart').getContext('2d');
  if (myChart) myChart.destroy();
  myChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['10年後資產總額 (萬元)'],
      datasets: [
        { label: '現在購屋', data: [buy/10000], backgroundColor: '#c9922b', borderRadius: 8 },
        { label: '持續觀望', data: [nobuy/10000], backgroundColor: '#3d4e63', borderRadius: 8 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8271' } },
        x: { ticks: { color: '#8e8271' } }
      },
      plugins: { legend: { labels: { color: '#d4c9b8', font: { family: 'Noto Serif TC' } } } }
    }
  });
}

// 原本的 CRM 同步功能
function syncToCRM() {
  const btn = g('syncBtn');
  const msg = g('syncMsg');
  btn.disabled = true;
  btn.textContent = '⏳ 正在同步數據...';

  // 模擬原本的 API 調用邏輯
  const customerData = {
    salary: g('salary').value,
    targetPrice: g('targetPrice').value,
    diff: g('projDiff').innerText
  };

  // 這裡應填入你原始代碼中的 Google Script API URL
  const apiUrl = 'https://script.google.com/macros/s/AKfycbyt8tcy6pORzZ1nc0HP4YVLV-AY1tOuahJWjhmWQ2VBTSZPLZe2qgBzZgczbDQTVsPI/exec';
  
  fetch(apiUrl, {
    method: 'POST',
    mode: 'no-cors', // 配合 Google Apps Script 
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'save', customer: customerData })
  })
  .then(() => {
    msg.style.color = '#27ae60';
    msg.textContent = '✅ 報告已成功同步至 CRM 系統，顧問將儘速聯繫您。';
    btn.textContent = '✅ 同步完成';
  })
  .catch(e => {
    msg.style.color = '#ff6b6b';
    msg.textContent = '❌ 同步失敗，請檢查網路連線。';
    btn.disabled = false;
    btn.textContent = '重試同步';
  });
}

window.onload = calc;
</script>
</body>
</html>
