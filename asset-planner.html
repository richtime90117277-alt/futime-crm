<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富時代｜資產規劃報告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
    body{background:#08111e;color:#e6e6e6;padding:10px;}
    .wrap{max-width:580px;margin:0 auto;position:relative}
    #vSplash{position:fixed;inset:0;background:#08111e;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px}
    .splash-title{font-size:22px;color:#f5d87a;margin-bottom:10px}
    .splash-desc{color:#aaa;margin-bottom:30px}
    .btn-start{background:linear-gradient(90deg,#c9922b,#e8b84b);color:#000;border:none;border-radius:12px;padding:14px 28px;font-weight:bold}
    .tb{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
    .logo{color:#f5d87a;font-weight:bold}
    .tabs{display:flex;gap:10px}
    .tab{padding:6px 10px;border-radius:8px;background:#152238}
    .tab.on{background:#c9922b;color:#000}
    .card{background:#0f1e30;border-radius:14px;padding:16px;margin-bottom:12px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    label{font-size:12px;color:#ccc;margin-bottom:4px;display:block}
    input,select{width:100%;background:#152238;border:1px solid #253450;border-radius:8px;padding:10px;color:#fff}
    .st{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #253450}
    .seg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .seg-btn{background:#152238;border-radius:8px;padding:10px;text-align:center}
    .seg-btn.on{background:#c9922b;color:#000}
    .gbar{position:fixed;bottom:0;left:0;right:0;background:#08111e;padding:10px;max-width:580px;margin:0 auto}
    .btn-gen{width:100%;background:linear-gradient(90deg,#c9922b,#e8b84b);color:#000;border:none;border-radius:12px;padding:16px;font-weight:bold;font-size:16px}
    #vR{display:none;padding-bottom:100px}
    .rh{text-align:center;padding:20px 0}
    .rh-title{font-size:20px;color:#f5d87a;margin-bottom:6px}
    .urgency{background:#221515;border-left:4px solid #c44;border-radius:8px;padding:12px;margin-bottom:12px}
    .seg-card{background:#152238;border-radius:10px;padding:14px;margin-bottom:12px}
    .nc{background:#152238;border-radius:10px;padding:14px;margin-bottom:12px}
    .sp{font-size:26px;color:#f5d87a;font-weight:bold}
    .rat{margin:10px 0}
    .bbg{width:100%;height:8px;background:#253450;border-radius:4px;overflow:hidden}
    .bfi{height:8px;background:linear-gradient(90deg,#c9922b,#e8b84b);width:65%}
    .chart-section{margin:16px 0;height:200px}
    .path-section{margin:16px 0}
    .action-final{background:#1a2a45;border-radius:12px;padding:18px;text-align:center;margin:20px 0}

    /* 我幫你加的客戶化元素 */
    .user-bar{background:#152238;border-radius:10px;padding:12px;margin-bottom:12px}
    .compare-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .compare-item{background:#152238;border-radius:10px;padding:12px;text-align:center}
    .gap-box{background:#152238;border-radius:10px;padding:14px;margin-bottom:12px}
    .gap-row{display:flex;justify-content:space-between;padding:6px 0}
  </style>
</head>
<body>
<div class="wrap">

  <!-- 引導頁 -->
  <div id="vSplash">
    <div class="splash-title">富時代｜資產規劃報告</div>
    <div class="splash-desc">數字不會說謊，看清楚自己的資產未來</div>
    <button class="btn-start" onclick="start()">開始規劃</button>
  </div>

  <!-- 頂部 -->
  <div class="tb">
    <div class="logo">富時代</div>
    <div class="tabs">
      <div class="tab on">基本資料</div>
      <div class="tab">目標</div>
    </div>
  </div>

  <!-- 我幫你加的：個人化資訊 -->
  <div class="user-bar">
    <div style="font-size:12px;color:#ccc">客戶專屬資訊</div>
    <div style="display:flex;justify-content:space-between;margin-top:6px">
      <div>姓名：________</div>
      <div>年齡：________</div>
    </div>
  </div>

  <!-- 表單 -->
  <div class="card">
    <div class="g2">
      <div>
        <label>目前年收入</label>
        <input type="text" placeholder="輸入金額">
      </div>
      <div>
        <label>每月可投入</label>
        <input type="text" placeholder="輸入金額">
      </div>
    </div>
    <div class="st">
      <span>風險屬性</span>
      <span>穩健型</span>
    </div>
  </div>

  <!-- 我幫你加的：時間價值對比 -->
  <div class="card">
    <div style="font-size:14px;color:#f5d87a;margin-bottom:10px">時間價值對比</div>
    <div class="compare-box">
      <div class="compare-item">
        <div style="font-size:12px">現在建置</div>
        <div style="font-size:18px;color:#f5d87a">368 萬</div>
      </div>
      <div class="compare-item">
        <div style="font-size:12px">延遲3年</div>
        <div style="font-size:18px;color:#f5d87a">242 萬</div>
      </div>
    </div>
    <div style="text-align:center;margin-top:8px;font-size:14px">
      差距：<span style="color:#f5d87a;font-weight:bold">126 萬</span>
    </div>
  </div>

  <!-- 我幫你加的：財務缺口 -->
  <div class="gap-box">
    <div style="font-size:14px;color:#f5d87a;margin-bottom:8px">潛在財務缺口</div>
    <div class="gap-row"><span>退休缺口</span><span>420 萬</span></div>
    <div class="gap-row"><span>醫療缺口</span><span>180 萬</span></div>
    <div class="gap-row"><span>保障缺口</span><span>350 萬</span></div>
  </div>

  <!-- 報告區 -->
  <div id="vR">
    <div class="rh">
      <div class="rh-title">個人資產規劃報告</div>
      <div style="font-size:12px;color:#aaa">2026/04/06 產出</div>
    </div>

    <div class="urgency">
      延遲規劃將直接影響長期累積效益
    </div>

    <div class="seg-card">
      您的族群：穩健累積型｜重視長期、風險可控、目標明確
    </div>

    <div class="nc">
      <div>預期累積</div>
      <div class="sp">368 萬</div>
    </div>

    <div class="rat">
      <div style="font-size:12px;margin-bottom:4px">規劃完成度</div>
      <div class="bbg"><div class="bfi"></div></div>
    </div>

    <div class="chart-section">
      <canvas id="chart1"></canvas>
    </div>

    <!-- 我幫你加的：專業行動建議 -->
    <div class="action-final">
      <div style="color:#f5d87a;font-weight:bold;margin-bottom:8px">專業建議</div>
      <div style="font-size:14px;color:#ccc">
        本報告依現行市場條件精算，<br>建議儘早確認，以鎖定最佳配置效益
      </div>
    </div>
  </div>

  <!-- 按鈕 -->
  <div class="gbar">
    <button class="btn-gen" onclick="genReport()">產生報告</button>
  </div>

</div>

<script>
  function start(){document.getElementById('vSplash').style.display='none'}
  function genReport(){document.getElementById('vR').style.display='block'}
  window.onload=function(){new Chart(document.getElementById('chart1'),{
    type:'line',data:{
      labels:['現在','1年','3年','5年','10年'],
      datasets:[{label:'累積金額',data:[0,45,130,220,368],borderColor:'#e8b84b',backgroundColor:'#c9922b33',fill:true,tension:0.4}]
    },options:{plugins:{legend:{labels:{color:'#ccc'}}}
  })}
</script>
</body>
</html>
