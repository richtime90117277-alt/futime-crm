<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富時代｜八部曲晨會教學系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f13; --surface: #16161c; --surface2: #1e1e26;
  --border: #2a2a36; --gold: #c9a84c; --gold2: #f0d080;
  --text: #e8e4dc; --muted: #888; --green: #4caf82; --red: #e05555;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Serif TC',serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ── NAV TABS ── */
.nav-tabs {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; height:52px; gap:4px;
}
.brand-small { font-size:11px; letter-spacing:0.2em; color:var(--gold); margin-right:20px; white-space:nowrap; }
.tab-btn {
  padding:8px 18px; border-radius:8px; cursor:pointer;
  font-size:13px; font-family:inherit; border:none;
  background:none; color:var(--muted); transition:all 0.2s;
}
.tab-btn.active { background:var(--surface2); color:var(--text); }
.tab-btn:hover:not(.active) { color:var(--text); }
.date-badge {
  margin-left:auto; font-family:'DM Mono',monospace; font-size:11px;
  color:var(--muted); border:1px solid var(--border); padding:3px 10px; border-radius:20px;
}

.page { display:none; padding-top:52px; min-height:100vh; }
.page.active { display:block; }

/* ══════════════════════════════════
   PAGE 1: 教學
══════════════════════════════════ */
.teach-layout { display:flex; min-height:calc(100vh - 52px); }

/* Sidebar */
.sidebar {
  width:260px; flex-shrink:0; border-right:1px solid var(--border);
  background:var(--surface); overflow-y:auto;
  position:sticky; top:52px; height:calc(100vh - 52px);
}
.sb-chapter { border-bottom:1px solid var(--border); }
.sb-ch-header {
  padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:10px;
  transition:background 0.2s; user-select:none;
}
.sb-ch-header:hover { background:var(--surface2); }
.sb-ch-emoji { font-size:18px; }
.sb-ch-info { flex:1; }
.sb-ch-num { font-size:10px; color:var(--muted); letter-spacing:0.1em; }
.sb-ch-name { font-size:14px; font-weight:700; }
.sb-ch-arrow { font-size:10px; color:var(--muted); transition:transform 0.2s; }
.sb-ch-arrow.open { transform:rotate(180deg); }
.sb-nodes { display:none; }
.sb-nodes.open { display:block; }
.sb-node {
  padding:10px 16px 10px 44px; cursor:pointer;
  font-size:13px; color:var(--muted); transition:all 0.2s;
  display:flex; align-items:center; gap:8px; border-left:2px solid transparent;
}
.sb-node:hover { color:var(--text); background:var(--surface2); }
.sb-node.active { color:var(--gold); border-left-color:var(--gold); background:var(--surface2); }
.sb-node-dot { width:6px; height:6px; border-radius:50%; background:var(--border); flex-shrink:0; }
.sb-node.has-data .sb-node-dot { background:var(--green); }
.sb-node.active .sb-node-dot { background:var(--gold); }
.sb-ver-badge {
  font-family:'DM Mono',monospace; font-size:9px; color:var(--muted);
  background:var(--surface); border:1px solid var(--border);
  padding:1px 5px; border-radius:4px; margin-left:auto;
}

/* Main content */
.teach-main { flex:1; overflow-y:auto; padding:28px 32px 60px; max-width:800px; }

.teach-top-bar {
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom:24px; gap:16px;
}
.teach-title-area { flex:1; }
.teach-ch-label { font-size:11px; color:var(--gold); letter-spacing:0.15em; margin-bottom:4px; }
.teach-node-title { font-size:26px; font-weight:900; }
.teach-actions { display:flex; gap:8px; flex-shrink:0; }
.action-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); padding:8px 14px; border-radius:8px;
  cursor:pointer; font-size:12px; font-family:inherit; transition:all 0.2s; white-space:nowrap;
}
.action-btn:hover { color:var(--text); border-color:var(--gold); }
.action-btn.primary { background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:700; }
.action-btn.primary:hover { background:var(--gold2); }

/* Version selector */
.ver-selector {
  display:flex; align-items:center; gap:8px; margin-bottom:20px;
  padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
}
.ver-label { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; }
.ver-tabs { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
.ver-tab {
  padding:4px 12px; border-radius:6px; cursor:pointer; font-size:11px;
  background:var(--surface2); border:1px solid var(--border); color:var(--muted);
  font-family:'DM Mono',monospace; transition:all 0.2s; white-space:nowrap;
}
.ver-tab.active { background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:700; }
.ver-tab:hover:not(.active) { border-color:var(--gold); color:var(--text); }
.ver-del { font-size:11px; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:4px; }
.ver-del:hover { color:var(--red); }

/* Note area */
.note-area {
  margin-top:16px; padding:14px 16px;
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  border-left:3px solid var(--gold);
}
.note-label { font-size:10px; color:var(--gold); letter-spacing:0.15em; font-family:'DM Mono',monospace; margin-bottom:8px; }
.note-input {
  width:100%; background:none; border:none; outline:none;
  color:var(--text); font-size:13px; font-family:inherit; line-height:1.7;
  resize:none; min-height:60px;
}
.note-input::placeholder { color:var(--muted); }
.note-save-btn {
  margin-top:8px; padding:5px 14px; border-radius:6px; font-size:11px;
  background:var(--gold); color:var(--bg); border:none; cursor:pointer; font-family:inherit; font-weight:700;
}

/* Empty state */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:400px; gap:12px; color:var(--muted); text-align:center;
}
.empty-icon { font-size:48px; opacity:0.3; }
.empty-text { font-size:14px; }

/* Loading */
.tv-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; gap:16px; }
.loading-ring { width:40px; height:40px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--gold); animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:13px; color:var(--muted); letter-spacing:0.1em; }

/* Teaching cards */
.teach-cards { display:flex; flex-direction:column; gap:14px; }
.teach-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; animation:fadeUp 0.35s ease both; }
.teach-card:nth-child(2){animation-delay:.07s} .teach-card:nth-child(3){animation-delay:.14s}
.teach-card:nth-child(4){animation-delay:.21s} .teach-card:nth-child(5){animation-delay:.28s}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.tc-label { padding:10px 20px; font-size:10px; letter-spacing:0.25em; font-family:'DM Mono',monospace; border-bottom:1px solid var(--border); }
.tc-body { padding:18px 20px; font-size:14px; line-height:1.85; color:var(--text); }
.tc-body ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
.tc-body ul li { display:flex; gap:10px; }
.tc-body ul li::before { content:attr(data-num); color:var(--gold); font-weight:700; flex-shrink:0; }
.err-item { display:flex; gap:10px; margin-bottom:8px; color:#e8a0a0; }
.err-item::before { content:'✗'; color:var(--red); flex-shrink:0; }
.script-card { background:var(--surface2); border-color:var(--gold); }
.script-card .tc-label { background:var(--gold); color:var(--bg); border-bottom:none; }
.script-text { font-size:17px; font-weight:700; line-height:1.7; color:var(--gold2); padding:18px 20px; border-left:3px solid var(--gold); margin:0 20px 20px; border-radius:0 8px 8px 0; background:rgba(201,168,76,0.06); }
.qa-card { background:var(--surface2); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.qa-header { padding:12px 20px; background:#1a2a1a; border-bottom:1px solid var(--border); }
.qa-tag { font-size:10px; letter-spacing:0.2em; color:var(--green); font-family:'DM Mono',monospace; }
.qa-list { padding:14px 20px; display:flex; flex-direction:column; gap:8px; }
.qa-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; cursor:pointer; transition:all 0.2s; display:flex; align-items:flex-start; gap:12px; }
.qa-item:hover { border-color:var(--green); }
.qa-num { width:22px; height:22px; border-radius:50%; background:#1a2a1a; color:var(--green); font-size:10px; font-weight:700; font-family:'DM Mono',monospace; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
.qa-text { font-size:13px; line-height:1.6; flex:1; }
.qa-reveal { display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); line-height:1.7; }
.qa-item.revealed .qa-reveal { display:block; }
.qa-item.revealed { border-color:var(--green); background:#111a11; }
.drill-section { margin-top:14px; }
.drill-header { font-size:10px; letter-spacing:0.2em; color:var(--muted); margin-bottom:8px; font-family:'DM Mono',monospace; }
.drill-btns { display:flex; flex-direction:column; gap:6px; }
.drill-btn { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:10px; text-align:left; }
.drill-btn:hover { border-color:var(--gold); background:var(--surface2); }
.drill-icon { font-size:15px; flex-shrink:0; }
.drill-text { flex:1; font-size:13px; color:var(--text); line-height:1.4; }
.drill-arrow { font-size:11px; color:var(--border); }
.drill-result { margin-top:6px; padding:16px 18px; background:var(--surface2); border:1px solid var(--border); border-left:3px solid var(--gold); border-radius:10px; font-size:13px; line-height:1.9; color:var(--text); white-space:pre-wrap; animation:fadeUp 0.3s ease; }
.drill-result-title { font-size:10px; color:var(--gold); letter-spacing:0.15em; margin-bottom:10px; font-family:'DM Mono',monospace; }

/* ══════════════════════════════════
   PAGE 2: 素材庫
══════════════════════════════════ */
.library-page { padding:28px 32px 60px; max-width:900px; margin:0 auto; }
.lib-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.lib-title { font-size:22px; font-weight:900; }
.lib-stats { font-size:13px; color:var(--muted); }
.lib-grid { display:flex; flex-direction:column; gap:8px; }
.lib-item {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 20px; display:flex; align-items:center; gap:16px;
  cursor:pointer; transition:all 0.2s;
}
.lib-item:hover { border-color:var(--gold); background:var(--surface2); }
.lib-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.lib-info { flex:1; }
.lib-node-name { font-size:15px; font-weight:700; margin-bottom:3px; }
.lib-meta { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; }
.lib-ver-count {
  font-size:12px; font-family:'DM Mono',monospace;
  background:var(--surface2); border:1px solid var(--border);
  padding:4px 12px; border-radius:20px; color:var(--muted); white-space:nowrap;
}
.lib-empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
.lib-chapter-label {
  font-size:10px; letter-spacing:0.2em; color:var(--muted);
  font-family:'DM Mono',monospace; padding:16px 0 8px;
}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav-tabs">
  <div class="brand-small">RICHTIMES 富時代</div>
  <button class="tab-btn active" onclick="switchTab('teach')">🎓 晨會教學</button>
  <button class="tab-btn" onclick="switchTab('library')">📚 素材庫</button>
  <div class="date-badge" id="dateBadge"></div>
</div>

<!-- PAGE: TEACH -->
<div class="page active" id="pageTeach">
  <div class="teach-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="teach-main" id="teachMain">
      <div class="empty-state">
        <div class="empty-icon">👈</div>
        <div class="empty-text">從左側選擇今日晨會節點</div>
      </div>
    </div>
  </div>
</div>

<!-- PAGE: LIBRARY -->
<div class="page" id="pageLibrary">
  <div class="library-page">
    <div class="lib-header">
      <div>
        <div class="lib-title">📚 素材庫</div>
        <div class="lib-stats" id="libStats"></div>
      </div>
      <button class="action-btn" onclick="exportAll()">匯出全部</button>
    </div>
    <div class="lib-grid" id="libGrid"></div>
  </div>
</div>

<script>
const WORKER_URL = "https://futime-training.richtime90117277.workers.dev";
const STORAGE_KEY = "futime_v2";

const SYSTEM = `你是富時代房地產顧問公司的資深訓練師，正在帶領晨會教學。

【富時代核心哲學——必須貫穿所有內容】
富時代是資產顧問，不是房仲。核心理念是「先資產、後買房」。
- 不動產有六大功能：自住、收租、增值、節稅、傳承、槓桿
- 顧問的角色是幫客戶釐清「買房對你的人生目標有什麼幫助」
- 絕對不主動推物件、不說「看房」、不像傳統仲介開口就問「有沒有在找房」
- 話術要像財務顧問、像朋友，不像業務員
- 開場先關心客戶的財務狀況與人生規劃，不是房子本身
- 信任是設計出來的，每個動作都在塑造「我是你的顧問，不是要賺你錢的業務」
- 異議處理不是說服，是讓客戶自己想通

【話術風格】
- 口語自然，像朋友聊天，不像背稿
- 不說「我們的物件」「這個案子」「帶你去看」
- 多說「你現在的資產配置」「幫你做個規劃」「站在你的角度」

用繁體中文回答，口語化、有畫面感、像在現場手把手教學新人。
請用以下JSON格式輸出（只輸出JSON，不要有其他文字）：
{
  "goal": "這一步的目標——用顧問思維描述（一句話）",
  "actions": ["具體動作1（符合顧問定位）", "具體動作2", "具體動作3", "具體動作4"],
  "errors": ["新人最容易犯的仲介式錯誤1", "新人最容易犯的仲介式錯誤2"],
  "script": "符合富時代顧問風格的話術（1-2句，加引號，像在跟朋友聊天）",
  "next": "下一步接到哪個環節（一句話）",
  "questions": [
    {"q": "問新人的問題1（測試顧問思維）", "hint": "參考答案1"},
    {"q": "問新人的問題2", "hint": "參考答案2"},
    {"q": "問新人的問題3", "hint": "參考答案3"}
  ],
  "drills": ["可繼續深入的子題1", "可繼續深入的子題2", "可繼續深入的子題3"]
}`;

const chapters = [
  { id:"A", emoji:"🎯", title:"一部曲", subtitle:"開發名單", color:"#5b7cc4",
    nodes:[{id:"A1",name:"市場開發與曝光",hint:"研討會／異業合作／社群／轉介"},{id:"A2",name:"初步接觸與諮詢",hint:"主動邀約、了解背景動機"}]},
  { id:"B", emoji:"🤝", title:"二部曲", subtitle:"建立信任", color:"#3a9d8c",
    nodes:[{id:"B1",name:"見面前準備",hint:"資料預習／場地選擇"},{id:"B2",name:"開場前五分鐘",hint:"暖場、說明目的、禁忌動作"},{id:"B3",name:"傾聽技巧",hint:"關鍵問題設計、讓客戶多說"}]},
  { id:"C", emoji:"🔍", title:"三部曲", subtitle:"需求與痛點", color:"#7a6cc4",
    nodes:[{id:"C1",name:"需求訪談",hint:"房地產六大功能釐清購屋目的"},{id:"C2",name:"財務健檢",hint:"收支盤點、風險評估、貸款初判"}]},
  { id:"D", emoji:"🏠", title:"四部曲", subtitle:"物件配對", color:"#c98a3a",
    nodes:[{id:"D1",name:"資產配置建議",hint:"依財務狀況提供合適產品規劃"},{id:"D2",name:"產品媒合與推薦",hint:"利弊分析、回報試算、進出策略"}]},
  { id:"E", emoji:"🛡️", title:"五部曲", subtitle:"異議處理", color:"#c4564b",
    nodes:[{id:"E1",name:"股票族應對",hint:"聽懂但不動／積桿放大"},{id:"E2",name:"問媽媽族應對",hint:"凡事問媽媽／女兒主導"},{id:"E3",name:"價格族應對",hint:"教科書殺價型"},{id:"E4",name:"合資族應對",hint:"姊妹合資資金不明"},{id:"E5",name:"無殼族應對",hint:"退休焦慮無殼"}]},
  { id:"F", emoji:"✍️", title:"六部曲", subtitle:"締結成交", color:"#2a9d5c",
    nodes:[{id:"F1",name:"簽約流程與陪同",hint:"注意事項、契約條款解說"},{id:"F2",name:"貸款協助",hint:"試算、銀行媒合、送件追蹤"}]},
  { id:"G", emoji:"📞", title:"七部曲", subtitle:"售後服務", color:"#5a8cc4",
    nodes:[{id:"G1",name:"交屋驗收",hint:"點交、驗屋、過戶流程"},{id:"G2",name:"代租代管",hint:"出租行銷、租客篩選、租務管理"},{id:"G3",name:"年度資產檢視",hint:"每年檢視配置、動態調整建議"}]},
  { id:"H", emoji:"💡", title:"跨部曲", subtitle:"心法", color:"#a08060",
    nodes:[{id:"H1",name:"顧問思維 vs 業務思維",hint:"為什麼不能只想著賣"},{id:"H2",name:"信任感是設計出來的",hint:"每個細節都在塑造印象"},{id:"H3",name:"轉介紹的時機與話術",hint:"成交後最黃金的 72 小時"}]},
];

// ── Storage ──
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveStore(store) { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

// store structure: { [nodeId]: { versions: [{data, note, savedAt}], currentVer: 0 } }

function getNodeStore(nodeId) {
  const store = loadStore();
  return store[nodeId] || null;
}
function saveVersion(nodeId, data, note="") {
  const store = loadStore();
  if (!store[nodeId]) store[nodeId] = { versions:[], currentVer:0 };
  store[nodeId].versions.unshift({ data, note, savedAt: new Date().toISOString() });
  store[nodeId].currentVer = 0;
  saveStore(store);
}
function saveNote(nodeId, verIdx, note) {
  const store = loadStore();
  if (store[nodeId] && store[nodeId].versions[verIdx]) {
    store[nodeId].versions[verIdx].note = note;
    saveStore(store);
  }
}
function deleteVersion(nodeId, verIdx) {
  const store = loadStore();
  if (!store[nodeId]) return;
  store[nodeId].versions.splice(verIdx, 1);
  if (store[nodeId].versions.length === 0) { delete store[nodeId]; }
  else { store[nodeId].currentVer = 0; }
  saveStore(store);
}

// ── State ──
let currentChapter = null;
let currentNode = null;
let currentVerIdx = 0;
let openChapters = {};

// ── Init ──
document.getElementById("dateBadge").textContent = (() => {
  const n = new Date();
  return `${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} 晨會`;
})();

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['teach','library'][i]===tab));
  document.getElementById('pageTeach').classList.toggle('active', tab==='teach');
  document.getElementById('pageLibrary').classList.toggle('active', tab==='library');
  if (tab==='library') renderLibrary();
}

// ── Sidebar ──
function buildSidebar() {
  const store = loadStore();
  const sb = document.getElementById("sidebar");
  sb.innerHTML = chapters.map(ch => {
    const isOpen = openChapters[ch.id];
    return `
    <div class="sb-chapter">
      <div class="sb-ch-header" onclick="toggleSbChapter('${ch.id}')">
        <span class="sb-ch-emoji">${ch.emoji}</span>
        <div class="sb-ch-info">
          <div class="sb-ch-num">${ch.title}</div>
          <div class="sb-ch-name">${ch.subtitle}</div>
        </div>
        <span class="sb-ch-arrow ${isOpen?'open':''}">▼</span>
      </div>
      <div class="sb-nodes ${isOpen?'open':''}">
        ${ch.nodes.map(node => {
          const ns = store[node.id];
          const isActive = currentNode && currentNode.id === node.id;
          const verCount = ns ? ns.versions.length : 0;
          return `
          <div class="sb-node ${isActive?'active':''} ${ns?'has-data':''}"
               onclick="selectNode('${ch.id}','${node.id}')">
            <div class="sb-node-dot"></div>
            <span style="flex:1;font-size:12px">${node.name}</span>
            ${verCount>0?`<span class="sb-ver-badge">v${verCount}</span>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleSbChapter(chId) {
  openChapters[chId] = !openChapters[chId];
  buildSidebar();
}

function selectNode(chId, nodeId) {
  currentChapter = chapters.find(c=>c.id===chId);
  currentNode = currentChapter.nodes.find(n=>n.id===nodeId);
  openChapters[chId] = true;
  currentVerIdx = 0;
  buildSidebar();
  renderTeachMain();
}

// ── Teach Main ──
function renderTeachMain() {
  const ns = getNodeStore(currentNode.id);
  const main = document.getElementById("teachMain");

  let verHtml = '';
  if (ns && ns.versions.length > 0) {
    verHtml = `
    <div class="ver-selector">
      <span class="ver-label">版本</span>
      <div class="ver-tabs">
        ${ns.versions.map((v,i) => {
          const d = new Date(v.savedAt);
          const label = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          return `<span class="ver-tab ${i===currentVerIdx?'active':''}" onclick="switchVer(${i})">${label}</span>`;
        }).join('')}
      </div>
      ${ns.versions.length>1?`<span class="ver-del" onclick="confirmDeleteVer()" title="刪除此版本">🗑</span>`:''}
    </div>`;
  }

  const currentVer = ns ? ns.versions[currentVerIdx] : null;
  const noteVal = currentVer ? (currentVer.note||'') : '';

  main.innerHTML = `
    <div class="teach-top-bar">
      <div class="teach-title-area">
        <div class="teach-ch-label">${currentChapter.title} · ${currentChapter.subtitle}</div>
        <div class="teach-node-title">${currentNode.name}</div>
      </div>
      <div class="teach-actions">
        ${currentVer ? `<button class="action-btn" onclick="generateNew()">🔄 新增版本</button>` : ''}
        <button class="action-btn primary" onclick="generateNew()">${currentVer?'＋再生成':'▶ 開始生成'}</button>
      </div>
    </div>
    ${verHtml}
    <div id="teachContent">
      ${currentVer ? renderContentHTML(currentVer.data) : `
        <div class="empty-state">
          <div class="empty-icon">${currentChapter.emoji}</div>
          <div class="empty-text">點「開始生成」讓 AI 準備今日教學內容</div>
        </div>`}
    </div>
    ${currentVer ? `
    <div class="note-area" style="margin-top:20px">
      <div class="note-label">📝 主管筆記 · 今日補充</div>
      <textarea class="note-input" id="noteInput" placeholder="記錄今天討論的補充、學員反應、特別案例…" rows="3">${noteVal}</textarea>
      <button class="note-save-btn" onclick="doSaveNote()">儲存筆記</button>
    </div>` : ''}
  `;
}

function switchVer(idx) {
  currentVerIdx = idx;
  renderTeachMain();
}

function confirmDeleteVer() {
  if (confirm('確定刪除這個版本？')) {
    deleteVersion(currentNode.id, currentVerIdx);
    currentVerIdx = 0;
    buildSidebar();
    renderTeachMain();
  }
}

function doSaveNote() {
  const val = document.getElementById("noteInput").value;
  saveNote(currentNode.id, currentVerIdx, val);
  const btn = document.querySelector('.note-save-btn');
  btn.textContent = '✓ 已儲存'; btn.style.background='#4caf82';
  setTimeout(()=>{ btn.textContent='儲存筆記'; btn.style.background=''; }, 1500);
}

async function generateNew() {
  const main = document.getElementById("teachMain");
  const contentEl = document.getElementById("teachContent");
  if (contentEl) {
    contentEl.innerHTML = `<div class="tv-loading"><div class="loading-ring"></div><div class="loading-text">AI 正在準備教學內容…</div></div>`;
  } else {
    renderTeachMain();
    document.getElementById("teachContent").innerHTML = `<div class="tv-loading"><div class="loading-ring"></div><div class="loading-text">AI 正在準備教學內容…</div></div>`;
  }

  const prompt = `請為晨會教學生成「${currentChapter.title}${currentChapter.subtitle} → ${currentNode.name}」的內容。（${currentNode.hint}）針對房地產新人業務。`;
  try {
    const res = await fetch(WORKER_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1500, system:SYSTEM, messages:[{role:"user",content:prompt}] })
    });
    const apiData = await res.json();
    let raw = apiData.content?.find(b=>b.type==="text")?.text || "{}";
    raw = raw.replace(/```json|```/g,"").trim();
    const d = JSON.parse(raw);
    saveVersion(currentNode.id, d);
    currentVerIdx = 0;
    buildSidebar();
    renderTeachMain();
  } catch(e) {
    document.getElementById("teachContent").innerHTML = `<div style="color:#e05555;padding:20px">⚠️ 生成失敗，請再試一次。<br><small style="color:#666">${e.message}</small></div>`;
  }
}

function renderContentHTML(d) {
  const color = currentChapter.color;
  return `
  <div class="teach-cards">
    <div class="teach-card">
      <div class="tc-label" style="color:${color};background:${color}18">🎯 今日目標</div>
      <div class="tc-body" style="font-size:16px;font-weight:700;color:${color}">${d.goal||''}</div>
    </div>
    <div class="teach-card">
      <div class="tc-label" style="color:#aaa">📋 新人該做什麼</div>
      <div class="tc-body"><ul>${(d.actions||[]).map((a,i)=>`<li data-num="${['①','②','③','④'][i]||'·'}">${a}</li>`).join('')}</ul></div>
    </div>
    <div class="teach-card">
      <div class="tc-label" style="color:#e05555;background:#e0555518">⚠️ 常見錯誤</div>
      <div class="tc-body">${(d.errors||[]).map(e=>`<div class="err-item">${e}</div>`).join('')}</div>
    </div>
    <div class="teach-card script-card">
      <div class="tc-label">💬 可以直接用的話術</div>
      <div class="script-text">${d.script||''}</div>
    </div>
    <div class="teach-card">
      <div class="tc-label" style="color:#aaa">→ 下一步</div>
      <div class="tc-body" style="color:var(--muted)">${d.next||''}</div>
    </div>
  </div>
  <div class="qa-card" style="margin-top:14px">
    <div class="qa-header">
      <div class="qa-tag">INTERACTION · 互動提問</div>
    </div>
    <div class="qa-list">
      ${(d.questions||[]).map((q,i)=>`
        <div class="qa-item" onclick="this.classList.toggle('revealed')">
          <div class="qa-num">${i+1}</div>
          <div><div class="qa-text">${q.q}</div><div class="qa-reveal">💡 ${q.hint}</div></div>
        </div>`).join('')}
    </div>
  </div>
  <div class="drill-section" style="margin-top:14px">
    <div class="drill-header">DRILL DOWN — 繼續深入</div>
    <div class="drill-btns">
      ${(d.drills||[]).map((dt,i)=>`
        <div class="drill-btn" onclick="doDrill('${dt.replace(/'/g,"\\'")}',this)">
          <span class="drill-icon">${['💬','🎯','⚡'][i]||'💡'}</span>
          <span class="drill-text">${dt}</span>
          <span class="drill-arrow">▶</span>
        </div>`).join('')}
    </div>
  </div>`;
}

async function doDrill(topic, btn) {
  btn.style.opacity="0.5"; btn.style.pointerEvents="none";
  const el = document.createElement("div");
  el.className="drill-result";
  el.innerHTML=`<div class="drill-result-title">↳ ${topic}</div><div style="color:var(--muted)">⏳ 生成中…</div>`;
  btn.parentNode.insertBefore(el, btn.nextSibling);
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
  const prompt=`針對「${currentChapter.title}${currentChapter.subtitle} → ${currentNode.name}」，深入說明：${topic}。繁體中文，實戰口吻，含話術和常見錯誤，200字內。最後加：DRILLS:["子題1","子題2","子題3"]`;
  try {
    const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    const full=data.content?.find(b=>b.type==="text")?.text||"";
    const dm=full.match(/DRILLS:\[([^\]]+)\]/);
    let sub=[]; if(dm){try{sub=JSON.parse("["+dm[1]+"]");}catch(e){}}
    const text=full.replace(/DRILLS:\[[^\]]+\]/,"").trim();
    const icons=["💬","🎯","⚡"];
    el.innerHTML=`<div class="drill-result-title" style="color:var(--gold)">↳ ${topic}</div><div style="white-space:pre-wrap">${text}</div>
    ${sub.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace">繼續深入 →</div>
      ${sub.map((s,i)=>`<div onclick="doDrill('${s.replace(/'/g,"\\'")}',this)" style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;font-size:12px;color:var(--text)">
        <span>${icons[i]||'💡'}</span><span style="flex:1">${s}</span><span style="color:var(--border)">▶</span></div>`).join('')}
      </div>`:''}`; 
  } catch(e) { el.innerHTML+=`<div style="color:var(--red)">⚠️ 失敗</div>`; }
}

// ── Library ──
function renderLibrary() {
  const store = loadStore();
  const grid = document.getElementById("libGrid");
  let totalVers = 0;
  let totalNodes = 0;
  const rows = [];

  chapters.forEach(ch => {
    const chNodes = ch.nodes.filter(n => store[n.id]);
    if (chNodes.length === 0) return;
    rows.push(`<div class="lib-chapter-label">${ch.emoji} ${ch.title} · ${ch.subtitle}</div>`);
    chNodes.forEach(node => {
      const ns = store[node.id];
      const verCount = ns.versions.length;
      totalVers += verCount; totalNodes++;
      const latest = new Date(ns.versions[0].savedAt);
      const dateStr = `${latest.getMonth()+1}/${latest.getDate()} ${String(latest.getHours()).padStart(2,'0')}:${String(latest.getMinutes()).padStart(2,'0')}`;
      const hasNote = ns.versions.some(v=>v.note&&v.note.trim());
      rows.push(`
        <div class="lib-item" onclick="goToNode('${ch.id}','${node.id}')">
          <div class="lib-dot" style="background:${ch.color}"></div>
          <div class="lib-info">
            <div class="lib-node-name">${node.name} ${hasNote?'📝':''}</div>
            <div class="lib-meta">最近更新 ${dateStr}</div>
          </div>
          <div class="lib-ver-count">${verCount} 個版本</div>
        </div>`);
    });
  });

  document.getElementById("libStats").textContent = `共 ${totalNodes} 個節點 · ${totalVers} 個版本`;
  grid.innerHTML = rows.length ? rows.join('') : `<div class="lib-empty">還沒有任何教學紀錄<br>去晨會教學頁生成第一個節點吧！</div>`;
}

function goToNode(chId, nodeId) {
  switchTab('teach');
  selectNode(chId, nodeId);
}

function exportAll() {
  const store = loadStore();
  let text = "富時代八部曲教學素材庫\n匯出時間：" + new Date().toLocaleString('zh-TW') + "\n\n";
  chapters.forEach(ch => {
    ch.nodes.forEach(node => {
      const ns = store[node.id];
      if (!ns) return;
      text += `${"═".repeat(50)}\n`;
      text += `【${ch.title} ${ch.subtitle} → ${node.name}】\n`;
      text += `${"─".repeat(50)}\n`;
      ns.versions.forEach((v,i) => {
        const d = new Date(v.savedAt);
        text += `版本 ${i+1}（${d.toLocaleString('zh-TW')}）\n`;
        const data = v.data;
        text += `目標：${data.goal||''}\n`;
        text += `做什麼：\n${(data.actions||[]).map((a,j)=>`  ${['①','②','③','④'][j]} ${a}`).join('\n')}\n`;
        text += `常見錯誤：\n${(data.errors||[]).map(e=>`  ✗ ${e}`).join('\n')}\n`;
        text += `話術：${data.script||''}\n`;
        text += `下一步：${data.next||''}\n`;
        if (v.note && v.note.trim()) text += `主管筆記：${v.note}\n`;
        text += '\n';
      });
    });
  });
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `富時代素材庫_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

buildSidebar();
</script>
