<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富時代｜八部曲晨會教學系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f13;
  --surface: #16161c;
  --surface2: #1e1e26;
  --border: #2a2a36;
  --gold: #c9a84c;
  --gold2: #f0d080;
  --text: #e8e4dc;
  --muted: #888;
  --green: #4caf82;
  --red: #e05555;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Serif TC', serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}

/* ── HOME ── */
.home {
  min-height: 100vh; display: flex; flex-direction: column;
}
.home-header {
  padding: 32px 40px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { font-size: 12px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; }
.date-badge {
  font-family: 'DM Mono', monospace; font-size: 12px;
  color: var(--muted); border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 20px;
}
.home-hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
.home-hero h1 {
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 900; line-height: 1.1;
  background: linear-gradient(135deg, var(--gold2), var(--gold), #a07020);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.home-hero p { font-size: 14px; color: var(--muted); margin-bottom: 48px; letter-spacing: 0.05em; }

.chapters-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px; max-width: 900px; width: 100%; margin: 0 auto;
}
.ch-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px 24px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 16px;
  position: relative; overflow: hidden;
}
.ch-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 3px 0 0 3px;
}
.ch-card:hover {
  border-color: var(--gold); transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.ch-emoji { font-size: 28px; flex-shrink: 0; }
.ch-info { flex: 1; }
.ch-num { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 3px; }
.ch-name { font-size: 17px; font-weight: 700; }
.ch-count { font-size: 11px; color: var(--muted); margin-top: 3px; }
.ch-arrow { font-size: 14px; color: var(--border); }

/* ── CHAPTER PAGE ── */
.chapter-page {
  display: none; min-height: 100vh; flex-direction: column;
}
.chapter-page.active { display: flex; }

.cp-header {
  padding: 24px 32px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-family: inherit;
  transition: all 0.2s;
}
.back-btn:hover { color: var(--text); border-color: var(--gold); }
.cp-title { flex: 1; }
.cp-num { font-size: 11px; letter-spacing: 0.2em; color: var(--gold); }
.cp-name { font-size: 22px; font-weight: 900; }

.nodes-list {
  display: flex; flex-direction: column; gap: 8px;
  padding: 24px 32px; max-width: 800px; width: 100%; margin: 0 auto;
}
.node-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 24px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 16px;
  text-align: left;
}
.node-btn:hover { border-color: var(--gold); background: var(--surface2); }
.node-id {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
  flex-shrink: 0;
}
.node-btn-info { flex: 1; }
.node-btn-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.node-btn-hint { font-size: 12px; color: var(--muted); }
.node-btn-go { font-size: 14px; color: var(--border); }

/* ── TEACHING VIEW ── */
.teaching-view {
  display: none; min-height: 100vh; flex-direction: column;
}
.teaching-view.active { display: flex; }

.tv-header {
  padding: 20px 32px; border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 10;
}
.tv-breadcrumb { flex: 1; }
.tv-ch { font-size: 11px; color: var(--gold); letter-spacing: 0.15em; }
.tv-node { font-size: 20px; font-weight: 900; }
.teach-again-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 12px; font-family: inherit;
  transition: all 0.2s;
}
.teach-again-btn:hover { color: var(--text); border-color: var(--gold); }

.tv-body { flex: 1; padding: 32px; max-width: 900px; margin: 0 auto; width: 100%; }

/* Loading */
.tv-loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 300px; gap: 16px;
}
.loading-ring {
  width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--gold);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--muted); letter-spacing: 0.1em; }

/* Teaching cards */
.teach-cards { display: flex; flex-direction: column; gap: 16px; }

.teach-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.teach-card:nth-child(2) { animation-delay: 0.08s; }
.teach-card:nth-child(3) { animation-delay: 0.16s; }
.teach-card:nth-child(4) { animation-delay: 0.24s; }
.teach-card:nth-child(5) { animation-delay: 0.32s; }
.teach-card:nth-child(6) { animation-delay: 0.40s; }

.tc-label {
  padding: 10px 20px; font-size: 10px; letter-spacing: 0.25em;
  font-family: 'DM Mono', monospace; border-bottom: 1px solid var(--border);
}
.tc-body { padding: 20px; font-size: 15px; line-height: 1.85; color: var(--text); }
.tc-body ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tc-body ul li { display: flex; gap: 10px; }
.tc-body ul li::before { content: attr(data-num); color: var(--gold); font-weight: 700; flex-shrink: 0; }
.tc-body .err-item { display: flex; gap: 10px; margin-bottom: 8px; color: #e8a0a0; }
.tc-body .err-item::before { content: '✗'; color: var(--red); flex-shrink: 0; }

/* 話術 special */
.script-card { background: var(--surface2); border-color: var(--gold); }
.script-card .tc-label { background: var(--gold); color: var(--bg); border-bottom: none; }
.script-text {
  font-size: 18px; font-weight: 700; line-height: 1.7;
  color: var(--gold2); padding: 20px;
  border-left: 3px solid var(--gold); margin: 0 20px 20px;
  border-radius: 0 8px 8px 0; background: rgba(201,168,76,0.06);
}

/* 互動提問 */
.qa-section { margin-top: 8px; }
.qa-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.qa-header {
  padding: 12px 20px; background: #1a2a1a; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.qa-tag { font-size: 10px; letter-spacing: 0.2em; color: var(--green); font-family: 'DM Mono', monospace; }
.qa-title { font-size: 13px; color: var(--green); font-weight: 700; }
.qa-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.qa-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: flex-start; gap: 12px;
}
.qa-item:hover { border-color: var(--green); }
.qa-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: #1a2a1a; color: var(--green);
  font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.qa-text { font-size: 14px; line-height: 1.6; flex: 1; }
.qa-reveal { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); line-height: 1.7; }
.qa-item.revealed .qa-reveal { display: block; }
.qa-item.revealed { border-color: var(--green); background: #111a11; }

/* 深入按鈕 */
.drill-section { margin-top: 16px; }
.drill-header { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 10px; font-family: 'DM Mono', monospace; }
.drill-btns { display: flex; flex-direction: column; gap: 8px; }
.drill-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 18px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 12px;
  text-align: left;
}
.drill-btn:hover { border-color: var(--gold); background: var(--surface2); }
.drill-icon { font-size: 16px; flex-shrink: 0; }
.drill-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
.drill-arrow { font-size: 12px; color: var(--border); }

.drill-result {
  margin-top: 8px; padding: 18px 20px;
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 10px; font-size: 13px; line-height: 1.9; color: var(--text);
  white-space: pre-wrap; animation: fadeUp 0.3s ease;
}
.drill-result-title { font-size: 11px; color: var(--gold); letter-spacing: 0.15em; margin-bottom: 10px; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<!-- HOME -->
<div class="home" id="homePage">
  <div class="home-header">
    <div class="brand">Richtimes 富時代</div>
    <div class="date-badge" id="dateBadge"></div>
  </div>
  <div class="home-hero">
    <h1>八部曲<br>晨會教學</h1>
    <p>選擇今日主題，開始帶領新人學習</p>
    <div class="chapters-grid" id="chaptersGrid"></div>
  </div>
</div>

<!-- CHAPTER PAGE -->
<div class="chapter-page" id="chapterPage">
  <div class="cp-header">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="cp-title">
      <div class="cp-num" id="cpNum"></div>
      <div class="cp-name" id="cpName"></div>
    </div>
  </div>
  <div class="nodes-list" id="nodesList"></div>
</div>

<!-- TEACHING VIEW -->
<div class="teaching-view" id="teachingView">
  <div class="tv-header">
    <button class="back-btn" onclick="goChapter()">← 返回</button>
    <div class="tv-breadcrumb">
      <div class="tv-ch" id="tvCh"></div>
      <div class="tv-node" id="tvNode"></div>
    </div>
    <button class="teach-again-btn" onclick="teachAgain()">🔄 重新生成</button>
  </div>
  <div class="tv-body" id="tvBody"></div>
</div>

<script>
const WORKER_URL = "https://futime-training.richtime90117277.workers.dev";

const SYSTEM = `你是富時代房地產顧問公司的資深訓練師，正在帶領晨會教學。
用繁體中文回答，口語化、有畫面感、像在現場手把手教學。

請用以下JSON格式輸出（只輸出JSON，不要有其他文字）：
{
  "goal": "這一步的目標（一句話）",
  "actions": ["動作1", "動作2", "動作3", "動作4"],
  "errors": ["常見錯誤1", "常見錯誤2"],
  "script": "可以直接說出口的話術（1-2句，加引號）",
  "next": "下一步接到哪個環節（一句話）",
  "questions": [
    {"q": "問新人的問題1", "hint": "參考答案提示1"},
    {"q": "問新人的問題2", "hint": "參考答案提示2"},
    {"q": "問新人的問題3", "hint": "參考答案提示3"}
  ],
  "drills": ["可繼續深入的子題1", "可繼續深入的子題2", "可繼續深入的子題3"]
}`;

const chapters = [
  { id:"A", emoji:"🎯", title:"一部曲", subtitle:"開發名單", color:"#5b7cc4",
    nodes:[{id:"A1",name:"市場開發與曝光",hint:"研討會／異業合作／社群／轉介"},{id:"A2",name:"初步接觸與諮詢",hint:"主動邀約、了解背景動機"}]},
  { id:"B", emoji:"🤝", title:"二部曲", subtitle:"建立信任", color:"#3a9d8c",
    nodes:[{id:"B1",name:"見面前準備",hint:"資料預習／場地選擇"},{id:"B2",name:"開場前五分鐘",hint:"暖場、說明目的、禁忌動作"},{id:"B3",name:"傾聽技巧",hint:"關鍵問題設計、讓客戶多說"}]},
  { id:"C", emoji:"🔍", title:"三部曲", subtitle:"需求與痛點", color:"#7a6cc4",
    nodes:[{id:"C1",name:"需求訪談",hint:"房地產六大功能釐清購屋目的"},{id:"C2",name:"財務健檢",hint:"收支盤點、風險評估、貸款初判"}]},
  { id:"D", emoji:"🏠", title:"四部曲", subtitle:"物件配對", color:"#c98a3a",
    nodes:[{id:"D1",name:"資產配置建議",hint:"依財務狀況提供合適產品規劃"},{id:"D2",name:"產品媒合與推薦",hint:"利弊分析、回報試算、進出策略"}]},
  { id:"E", emoji:"🛡️", title:"五部曲", subtitle:"異議處理", color:"#c4564b",
    nodes:[{id:"E1",name:"股票族應對",hint:"聽懂但不動／積桿放大"},{id:"E2",name:"問媽媽族應對",hint:"凡事問媽媽／女兒主導"},{id:"E3",name:"價格族應對",hint:"教科書殺價型"},{id:"E4",name:"合資族應對",hint:"姊妹合資資金不明"},{id:"E5",name:"無殼族應對",hint:"退休焦慮無殼"}]},
  { id:"F", emoji:"✍️", title:"六部曲", subtitle:"締結成交", color:"#2a9d5c",
    nodes:[{id:"F1",name:"簽約流程與陪同",hint:"注意事項、契約條款解說"},{id:"F2",name:"貸款協助",hint:"試算、銀行媒合、送件追蹤"}]},
  { id:"G", emoji:"📞", title:"七部曲", subtitle:"售後服務", color:"#5a8cc4",
    nodes:[{id:"G1",name:"交屋驗收",hint:"點交、驗屋、過戶流程"},{id:"G2",name:"代租代管",hint:"出租行銷、租客篩選、租務管理"},{id:"G3",name:"年度資產檢視",hint:"每年檢視配置、動態調整建議"}]},
  { id:"H", emoji:"💡", title:"跨部曲", subtitle:"心法", color:"#a08060",
    nodes:[{id:"H1",name:"顧問思維 vs 業務思維",hint:"為什麼不能只想著賣"},{id:"H2",name:"信任感是設計出來的",hint:"每個細節都在塑造印象"},{id:"H3",name:"轉介紹的時機與話術",hint:"成交後最黃金的 72 小時"}]},
];

let currentChapter = null;
let currentNode = null;
let currentData = null;

// Date
const now = new Date();
document.getElementById("dateBadge").textContent =
  `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 晨會`;

// Build home
function buildHome() {
  const grid = document.getElementById("chaptersGrid");
  grid.innerHTML = chapters.map(ch => `
    <div class="ch-card" onclick="goChapter('${ch.id}')" style="--ch-color:${ch.color}">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${ch.color};border-radius:3px 0 0 3px"></div>
      <span class="ch-emoji">${ch.emoji}</span>
      <div class="ch-info">
        <div class="ch-num">${ch.title}</div>
        <div class="ch-name">${ch.subtitle}</div>
        <div class="ch-count">${ch.nodes.length} 個教學節點</div>
      </div>
      <span class="ch-arrow">→</span>
    </div>
  `).join('');
}

function goHome() {
  document.getElementById("homePage").style.display = "flex";
  document.getElementById("chapterPage").classList.remove("active");
  document.getElementById("teachingView").classList.remove("active");
}

function goChapter(chId) {
  if (chId) currentChapter = chapters.find(c => c.id === chId);
  document.getElementById("homePage").style.display = "none";
  document.getElementById("chapterPage").classList.add("active");
  document.getElementById("teachingView").classList.remove("active");

  document.getElementById("cpNum").textContent = currentChapter.title;
  document.getElementById("cpName").textContent = currentChapter.subtitle;

  const list = document.getElementById("nodesList");
  list.innerHTML = currentChapter.nodes.map(node => `
    <div class="node-btn" onclick="startTeaching('${node.id}')">
      <div class="node-id" style="background:${currentChapter.color}22;color:${currentChapter.color}">${node.id}</div>
      <div class="node-btn-info">
        <div class="node-btn-name">${node.name}</div>
        <div class="node-btn-hint">${node.hint}</div>
      </div>
      <span class="node-btn-go" style="color:${currentChapter.color}">開始教學 →</span>
    </div>
  `).join('');
}

async function startTeaching(nodeId) {
  currentNode = currentChapter.nodes.find(n => n.id === nodeId);

  document.getElementById("chapterPage").classList.remove("active");
  document.getElementById("teachingView").classList.add("active");
  document.getElementById("tvCh").textContent = `${currentChapter.title} · ${currentChapter.subtitle}`;
  document.getElementById("tvNode").textContent = currentNode.name;

  await fetchAndRender();
}

async function teachAgain() {
  await fetchAndRender();
}

async function fetchAndRender() {
  const body = document.getElementById("tvBody");
  body.innerHTML = `<div class="tv-loading"><div class="loading-ring"></div><div class="loading-text">AI 正在準備教學內容…</div></div>`;

  const prompt = `請為晨會教學生成「${currentChapter.title}${currentChapter.subtitle} → ${currentNode.name}」的內容。（${currentNode.hint}）針對房地產新人業務。`;

  try {
    const res = await fetch(WORKER_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1500,
        system: SYSTEM,
        messages:[{role:"user", content:prompt}]
      })
    });
    const data = await res.json();
    let raw = data.content?.find(b=>b.type==="text")?.text || "{}";
    raw = raw.replace(/```json|```/g,"").trim();
    currentData = JSON.parse(raw);
    renderTeaching(currentData);
  } catch(e) {
    body.innerHTML = `<div style="color:#e05555;padding:20px">⚠️ 生成失敗，請點「重新生成」再試一次。<br><small style="color:#666">${e.message}</small></div>`;
  }
}

function renderTeaching(d) {
  const color = currentChapter.color;
  const body = document.getElementById("tvBody");

  body.innerHTML = `
    <div class="teach-cards">

      <!-- 目標 -->
      <div class="teach-card">
        <div class="tc-label" style="color:${color};background:${color}18">🎯 今日目標</div>
        <div class="tc-body" style="font-size:17px;font-weight:700;color:${color}">${d.goal||''}</div>
      </div>

      <!-- 做什麼 -->
      <div class="teach-card">
        <div class="tc-label" style="color:#aaa">📋 新人該做什麼</div>
        <div class="tc-body">
          <ul>${(d.actions||[]).map((a,i)=>`<li data-num="${['①','②','③','④'][i]||'·'}">${a}</li>`).join('')}</ul>
        </div>
      </div>

      <!-- 常見錯誤 -->
      <div class="teach-card">
        <div class="tc-label" style="color:#e05555;background:#e0555518">⚠️ 常見錯誤</div>
        <div class="tc-body">
          ${(d.errors||[]).map(e=>`<div class="err-item">${e}</div>`).join('')}
        </div>
      </div>

      <!-- 話術 -->
      <div class="teach-card script-card">
        <div class="tc-label">💬 可以直接用的話術</div>
        <div class="script-text">${d.script||''}</div>
      </div>

      <!-- 下一步 -->
      <div class="teach-card">
        <div class="tc-label" style="color:#aaa">→ 下一步</div>
        <div class="tc-body" style="color:var(--muted)">${d.next||''}</div>
      </div>

    </div>

    <!-- 互動提問 -->
    <div class="qa-section" style="margin-top:20px">
      <div class="qa-card">
        <div class="qa-header">
          <div class="qa-tag">INTERACTION</div>
          <div class="qa-title">💡 問問新人（點題目看提示）</div>
        </div>
        <div class="qa-list">
          ${(d.questions||[]).map((q,i)=>`
            <div class="qa-item" onclick="this.classList.toggle('revealed')">
              <div class="qa-num">${i+1}</div>
              <div>
                <div class="qa-text">${q.q}</div>
                <div class="qa-reveal">💡 參考答案：${q.hint}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- 深入 -->
    <div class="drill-section" style="margin-top:20px">
      <div class="drill-header">DRILL DOWN — 繼續深入</div>
      <div class="drill-btns" id="drillBtns">
        ${(d.drills||[]).map((dt,i)=>`
          <div class="drill-btn" onclick="doDrill('${dt.replace(/'/g,"\\'")}',this)">
            <span class="drill-icon">${['💬','🎯','⚡'][i]||'💡'}</span>
            <span class="drill-text">${dt}</span>
            <span class="drill-arrow">▶</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function doDrill(topic, btn) {
  btn.style.opacity = "0.5";
  btn.style.pointerEvents = "none";

  const el = document.createElement("div");
  el.className = "drill-result";
  el.innerHTML = `<div class="drill-result-title">↳ ${topic}</div><div style="color:var(--muted)">⏳ 生成中…</div>`;
  btn.parentNode.insertBefore(el, btn.nextSibling);

  const prompt = `針對「${currentChapter.title}${currentChapter.subtitle} → ${currentNode.name}」，請深入說明：${topic}。用繁體中文，實戰口吻，包含具體話術和新人常犯的錯，200字以內。最後加：DRILLS:["子題1","子題2","子題3"]`;

  try {
    const res = await fetch(WORKER_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:800,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data = await res.json();
    const full = data.content?.find(b=>b.type==="text")?.text||"";
    const drillMatch = full.match(/DRILLS:\[([^\]]+)\]/);
    let subDrills = [];
    if(drillMatch){try{subDrills=JSON.parse("["+drillMatch[1]+"]");}catch(e){}}
    const text = full.replace(/DRILLS:\[[^\]]+\]/,"").trim();
    const icons = ["💬","🎯","⚡"];
    el.innerHTML = `
      <div class="drill-result-title" style="color:var(--gold)">↳ ${topic}</div>
      <div style="white-space:pre-wrap">${text}</div>
      ${subDrills.length?`
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
          <div style="font-size:10px;color:var(--muted);letter-spacing:0.15em;margin-bottom:8px;font-family:'DM Mono',monospace">繼續深入 →</div>
          ${subDrills.map((s,i)=>`
            <div onclick="doDrill('${s.replace(/'/g,"\\'")}',this)"
                 style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:12px;color:var(--text);transition:all 0.2s"
                 onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--border)'">
              <span>${icons[i]||'💡'}</span><span style="flex:1">${s}</span><span style="color:var(--border)">▶</span>
            </div>`).join('')}
        </div>`:''
      }`;
    el.scrollIntoView({behavior:"smooth", block:"nearest"});
  } catch(e) {
    el.innerHTML += `<div style="color:var(--red)">⚠️ 失敗，請再試</div>`;
  }
}

buildHome();
</script>
</body>
</html>
