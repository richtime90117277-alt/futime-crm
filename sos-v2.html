<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富時代｜異議話術 SOS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --olive: #3D5A40;
  --olive-light: #4E7053;
  --olive-dim: rgba(61,90,64,0.08);
  --olive-mid: rgba(61,90,64,0.18);
  --red: #C0392B;
  --red-dim: rgba(192,57,43,0.08);
  --gold: #B8943C;
  --gold-dim: rgba(184,148,60,0.10);
  --bg: #FFFFFF;
  --bg2: #F9F7F5;
  --bg3: #F3F0EC;
  --border: rgba(0,0,0,0.08);
  --border-olive: rgba(61,90,64,0.22);
  --text: #1A1714;
  --text-sub: #6B6358;
  --text-dim: #9E9587;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
  --radius: 14px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}
.app { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

/* ── Header ── */
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.sos-badge {
  background: var(--red); color: #fff;
  font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 14px;
  letter-spacing: 0.08em; padding: 6px 14px; border-radius: 6px; flex-shrink: 0;
}
.header-text h1 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 18px; letter-spacing: 0.04em; color: var(--text); }
.header-text p { font-size: 11px; color: var(--text-dim); letter-spacing: 0.10em; margin-top: 2px; }

/* ── Tabs ── */
.tabs { display: flex; gap: 0; margin-bottom: 24px; background: var(--bg3); border-radius: var(--radius); padding: 4px; }
.tab-btn {
  flex: 1; padding: 9px 10px; border: none; border-radius: 10px; background: transparent;
  color: var(--text-sub); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.18s; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn.active { background: #fff; color: var(--olive); font-weight: 700; box-shadow: var(--shadow); }
.tab-icon { font-size: 14px; }

/* ── Section label ── */
.sec-label { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

/* ── Quick grid ── */
.quick-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin-bottom: 20px; }
.quick-btn {
  padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-sub); font-family: 'Noto Sans TC', sans-serif;
  font-size: 12px; text-align: left; cursor: pointer; transition: all 0.15s; line-height: 1.4;
}
.quick-btn:hover { border-color: var(--border-olive); color: var(--text); background: #fff; }
.quick-btn.active { border-color: var(--olive); color: var(--olive); background: var(--olive-dim); font-weight: 500; }

/* ── Input area ── */
.input-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.input-label span { font-size: 11px; color: var(--text-sub); letter-spacing: 0.10em; }
.pulse-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.75)} }

textarea {
  width: 100%; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px; color: var(--text);
  font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 400;
  line-height: 1.65; resize: none; outline: none; transition: border-color 0.2s; min-height: 80px;
}
textarea:focus { border-color: var(--olive); background: #fff; }
textarea::placeholder { color: var(--text-dim); font-size: 13px; }

/* ── Context pills ── */
.ctx-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
.ctx-pill {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px;
  background: #fff; color: var(--text-sub); font-size: 11px;
  font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s;
}
.ctx-pill:hover { border-color: var(--border-olive); color: var(--text); }
.ctx-pill.active { border-color: var(--olive); color: var(--olive); background: var(--olive-dim); font-weight: 500; }

.divider { height: 1px; background: var(--border); margin: 18px 0; }

/* ── SOS Button ── */
.sos-btn {
  width: 100%; padding: 15px; background: var(--red); border: none;
  border-radius: var(--radius-sm); color: #fff; font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: 15px; letter-spacing: 0.18em; cursor: pointer;
  transition: opacity 0.2s; margin-bottom: 20px;
}
.sos-btn:hover { opacity: 0.88; }
.sos-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Result ── */
.result-area { display: none; }
.result-area.visible { display: block; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.result-tag { font-size: 10px; letter-spacing: 0.14em; color: var(--olive); text-transform: uppercase; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.result-tag::before { content:''; width: 16px; height: 1.5px; background: var(--olive); }

.copy-all-btn {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg2); color: var(--text-sub); font-size: 11px;
  font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s;
}
.copy-all-btn:hover { border-color: var(--border-olive); color: var(--olive); }
.copy-all-btn.copied { color: var(--olive); border-color: var(--olive); }

.result-block { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
.block-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2);
}
.block-title { font-size: 11px; color: var(--olive); letter-spacing: 0.10em; font-weight: 700; }
.copy-btn {
  padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px;
  background: transparent; color: var(--text-dim); font-size: 10px;
  font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s;
}
.copy-btn:hover { border-color: var(--border-olive); color: var(--olive); }
.copy-btn.copied { color: var(--olive); border-color: var(--olive); }
.block-content { padding: 14px 16px; font-size: 13px; line-height: 1.9; color: var(--text); white-space: pre-wrap; word-break: break-word; }

.loading-wrap { display: flex; align-items: center; gap: 10px; padding: 28px 16px; color: var(--text-dim); font-size: 13px; }
.spinner { width: 16px; height: 16px; border: 1.5px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ── Browse ── */
.browse-list { display: flex; flex-direction: column; gap: 7px; }
.browse-item {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow); transition: border-color 0.15s;
}
.browse-item:hover { border-color: var(--border-olive); }
.browse-item.open { border-color: var(--olive); }
.browse-item-header { padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.browse-item-left { flex: 1; }
.browse-item-title { font-size: 13px; color: var(--text); font-weight: 700; margin-bottom: 2px; }
.browse-item-sub { font-size: 11px; color: var(--text-dim); }
.browse-chevron { color: var(--text-dim); font-size: 12px; transition: transform 0.2s; flex-shrink: 0; margin-left: 12px; }
.browse-item.open .browse-chevron { transform: rotate(180deg); }
.browse-content { display: none; border-top: 1px solid var(--border); }
.browse-content.open { display: block; }
.browse-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.browse-section:last-child { border-bottom: none; }
.browse-section-title { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--olive); text-transform: uppercase; margin-bottom: 7px; }
.browse-section-body { font-size: 13px; line-height: 1.85; color: var(--text); white-space: pre-wrap; }
.browse-copy-row { padding: 10px 16px 14px; }

/* ── QUIZ MODE ── */
.quiz-intro-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.quiz-intro-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; color: var(--olive); text-transform: uppercase; margin-bottom: 6px; }
.quiz-intro-title { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
.quiz-intro-desc { font-size: 12px; color: var(--text-sub); line-height: 1.7; margin-bottom: 16px; }
.quiz-category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.quiz-cat-btn {
  padding: 12px 14px; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; text-align: left; transition: all 0.15s;
  font-family: 'Noto Sans TC', sans-serif;
}
.quiz-cat-btn:hover { border-color: var(--border-olive); background: #fff; }
.quiz-cat-icon { font-size: 18px; margin-bottom: 4px; display: block; }
.quiz-cat-name { font-size: 12px; font-weight: 700; color: var(--text); display: block; margin-bottom: 2px; }
.quiz-cat-count { font-size: 10px; color: var(--text-dim); }

/* Quiz active state */
.quiz-progress-bar-wrap { background: var(--bg3); border-radius: 20px; height: 5px; margin-bottom: 6px; overflow: hidden; }
.quiz-progress-bar { height: 100%; background: var(--olive); border-radius: 20px; transition: width 0.4s ease; }
.quiz-progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 20px; }

.quiz-question-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 12px;
}
.quiz-q-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.quiz-q-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-sub); text-transform: uppercase; margin-bottom: 8px; }
.quiz-q-text { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.6; }
.quiz-scenario { font-size: 12px; color: var(--text-sub); background: var(--olive-dim); border-left: 2px solid var(--olive); padding: 8px 12px; border-radius: 0 6px 6px 0; margin-top: 10px; line-height: 1.6; font-style: italic; }
.quiz-options { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.quiz-option {
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.15s; font-size: 13px; color: var(--text); background: #fff;
  font-family: 'Noto Sans TC', sans-serif; text-align: left; line-height: 1.5;
  display: flex; align-items: flex-start; gap: 10px;
}
.quiz-option:hover:not(:disabled) { border-color: var(--border-olive); background: var(--olive-dim); }
.quiz-option.selected-correct { border-color: #27AE60; background: rgba(39,174,96,0.06); }
.quiz-option.selected-wrong { border-color: var(--red); background: var(--red-dim); }
.quiz-option.reveal-correct { border-color: #27AE60; background: rgba(39,174,96,0.06); }
.quiz-option:disabled { cursor: not-allowed; }
.option-letter {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  font-weight: 700; flex-shrink: 0; margin-top: 1px; color: var(--text-sub); transition: all 0.15s;
}
.quiz-option.selected-correct .option-letter { background: #27AE60; border-color: #27AE60; color: #fff; }
.quiz-option.selected-wrong .option-letter { background: var(--red); border-color: var(--red); color: #fff; }
.quiz-option.reveal-correct .option-letter { background: #27AE60; border-color: #27AE60; color: #fff; }

.quiz-feedback {
  margin: 0 16px 16px; border-radius: var(--radius-sm); padding: 14px 16px;
  font-size: 13px; line-height: 1.75; display: none;
}
.quiz-feedback.correct { background: rgba(39,174,96,0.07); border: 1px solid rgba(39,174,96,0.25); }
.quiz-feedback.wrong { background: var(--red-dim); border: 1px solid rgba(192,57,43,0.2); }
.quiz-feedback-title { font-weight: 700; margin-bottom: 5px; font-size: 12px; letter-spacing: 0.05em; }
.quiz-feedback.correct .quiz-feedback-title { color: #1e8449; }
.quiz-feedback.wrong .quiz-feedback-title { color: var(--red); }
.quiz-feedback-body { color: var(--text); white-space: pre-wrap; }

.quiz-next-btn {
  margin: 0 16px 16px; width: calc(100% - 32px); padding: 12px; background: var(--olive);
  border: none; border-radius: var(--radius-sm); color: #fff; font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; display: none;
}
.quiz-next-btn:hover { opacity: 0.85; }

/* Quiz result screen */
.quiz-result-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-card); text-align: center; padding: 28px 20px;
}
.quiz-score-ring { position: relative; width: 90px; height: 90px; margin: 0 auto 16px; }
.quiz-score-ring svg { transform: rotate(-90deg); }
.quiz-score-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.quiz-score-num { font-family: 'Noto Serif TC', serif; font-size: 24px; font-weight: 900; color: var(--text); }
.quiz-score-denom { font-size: 10px; color: var(--text-dim); }
.quiz-result-title { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
.quiz-result-desc { font-size: 12px; color: var(--text-sub); line-height: 1.7; margin-bottom: 20px; }
.quiz-result-meta { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
.quiz-meta-item { text-align: center; }
.quiz-meta-num { font-size: 20px; font-weight: 700; }
.quiz-meta-num.green { color: #27AE60; }
.quiz-meta-num.red { color: var(--red); }
.quiz-meta-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.quiz-result-actions { display: flex; gap: 8px; }
.quiz-retry-btn {
  flex: 1; padding: 12px; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-sub); font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.quiz-new-btn {
  flex: 1; padding: 12px; background: var(--olive); border: none;
  border-radius: var(--radius-sm); color: #fff; font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
}
.quiz-new-btn:hover { opacity: 0.85; }

/* ── CRM picker ── */
.crm-btn {
  width: 100%; background: var(--olive-dim); border: 1px solid var(--border-olive);
  border-radius: var(--radius-sm); padding: 10px 14px; color: var(--olive);
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  text-align: left; margin-bottom: 14px; transition: background 0.15s;
}
.crm-btn:hover { background: var(--olive-mid); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff;
  padding: 10px 18px; border-radius: 8px; font-size: 12px; transform: translateY(60px);
  opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

@media (max-width: 500px) {
  .quick-grid { grid-template-columns: 1fr; }
  .quiz-category-grid { grid-template-columns: 1fr; }
  .quiz-result-meta { gap: 16px; }
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="sos-badge">SOS</div>
    <div class="header-text">
      <h1>異議話術救援</h1>
      <p>RICHTIME · OBJECTION HANDLER · 智偉哥話術庫</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-search" onclick="switchTab('search')">
      <span class="tab-icon">🔍</span>即時查詢
    </button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">
      <span class="tab-icon">🎯</span>話術考試院
    </button>
    <button class="tab-btn" id="tab-browse" onclick="switchTab('browse')">
      <span class="tab-icon">📚</span>完整話術庫
    </button>
  </div>

  <!-- ─── SEARCH MODE ─── -->
  <div id="mode-search">
    <button class="crm-btn" onclick="openCrmPicker()">📋 從 CRM 選客戶，自動帶入異議描述</button>
    <div id="crmInfoBar" style="display:none;background:var(--olive-dim);border:1px solid var(--border-olive);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--olive);margin-bottom:12px"></div>

    <div class="sec-label">常見異議快選</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="quickSelect(this,'我再想想看，晚點再決定')">我再想想</button>
      <button class="quick-btn" onclick="quickSelect(this,'現在房市不好，我等房價跌再買')">等房價跌</button>
      <button class="quick-btn" onclick="quickSelect(this,'我要問我媽媽/太太/先生意見')">要問家人</button>
      <button class="quick-btn" onclick="quickSelect(this,'我有股票不想動，覺得股票比較好')">有股票不動</button>
      <button class="quick-btn" onclick="quickSelect(this,'我手頭資金不夠，買不起')">資金不夠</button>
      <button class="quick-btn" onclick="quickSelect(this,'我擔心爛尾樓風險，預售屋不安全')">怕爛尾樓</button>
      <button class="quick-btn" onclick="quickSelect(this,'我喜歡大社區，這個案子太小了')">想要大社區</button>
      <button class="quick-btn" onclick="quickSelect(this,'建商一直蓋房子，是要蓋給誰住？供過於求吧')">供過於求</button>
      <button class="quick-btn" onclick="quickSelect(this,'空戶率這麼高，還適合買房嗎')">空戶率太高</button>
      <button class="quick-btn" onclick="quickSelect(this,'台灣房市會不會像日本一樣泡沫化')">怕泡沫化</button>
      <button class="quick-btn" onclick="quickSelect(this,'我很想買但還是很猶豫，一直沒辦法下決定')">想要又猶豫</button>
      <button class="quick-btn" onclick="quickSelect(this,'客戶已下訂但想退訂，說再考慮一下')">要退訂</button>
    </div>

    <div class="input-label">
      <div class="pulse-dot"></div>
      <span>輸入客戶原話（越完整越精準）</span>
    </div>
    <textarea id="objInput" placeholder='例如：「我股票還有200萬，想等賣掉再說，現在不想動」' rows="3"></textarea>

    <div class="sec-label" style="margin-top:12px;margin-bottom:8px;">客戶背景</div>
    <div class="ctx-row">
      <button class="ctx-pill" onclick="toggleCtx(this,'有股票')">有股票</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'已婚')">已婚</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'首購族')">首購族</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'投資型客戶')">投資客</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'父母反對')">父母反對</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'租屋中')">租屋中</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'50歲以上')">50歲以上</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'外商/高薪')">外商高薪</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'已下訂但猶豫')">已下訂</button>
    </div>

    <div class="divider"></div>
    <button class="sos-btn" id="sosBtn" onclick="handleSOS()">▶ 立即救援</button>

// 建立綜合題庫（從各類別各取一題）
function buildMixedQuiz() {
  const all = [];
  Object.entries(QUIZ_BANK).forEach(([key, cat]) => {
    if (key !== 'mixed' && cat.questions.length > 0) {
      all.push({ ...cat.questions[0], catName: cat.name });
    }
  });
  // 洗牌
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all;
}

function handleSOS() {
  const input = document.getElementById('objInput').value.trim();
  if (!input) { document.getElementById('objInput').focus(); return; }
  const btn = document.getElementById('sosBtn');
  btn.disabled = true; btn.textContent = '⏳ 比對話術庫中...';

  resultArea.innerHTML = `<div class="result-block"><div class="loading-wrap"><div class="spinner"></div>正在比對最符合的話術...</div></div>`;
  setTimeout(() => {

    btn.disabled = false; btn.textContent = '▶ 立即救援';
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}
function findBestMatch(input) {
  const lower = input.toLowerCase();
  const keywords = {
    'reconsider': ['想想','考慮','等等','晚點','再說','再看','猶豫下不了決定','一直沒辦法'],
    'wait_drop': ['跌','房市不好','等房價','觀望','空戶','泡沫','供過','建商一直蓋'],
    'family': ['媽媽','太太','先生','家人','老公','老婆','父母','反對','要問'],
    'stock': ['股票','基金','不想動','股市'],
    'money': ['資金','不夠','買不起','錢','負擔','繳不起'],
    'rotten': ['爛尾','預售','不安全','信託','風險'],
    'bigcomplex': ['大社區','大樓','設備','游泳池','太小'],
    'oversupply': ['供過','建商蓋','蓋給誰住','供需'],
    'vacancy': ['空戶','沒人住','空屋'],
    'bubble': ['泡沫','日本','崩盤'],
    'hesitate': ['很想要','想要又','猶豫不決','下不了'],
    'refund': ['退訂','不買了','想退','取消']
  };
  const scores = DB.map(item => {
    let score = 0;
    const kws = keywords[item.id] || [];
    kws.forEach(kw => { if (lower.includes(kw)) score += 2; });
    if (selectedContexts.includes('有股票') && item.id === 'stock') score += 3;
    if (selectedContexts.includes('父母反對') && item.id === 'family') score += 3;
    if (selectedContexts.includes('已下訂但猶豫') && item.id === 'refund') score += 3;
    if (selectedContexts.includes('外商/高薪') && item.id === 'stock') score += 2;
    return { item, score };
  });
  scores.sort((a,b) => b.score - a.score);
  return scores[0].item;
}
function renderResult(query, match) {
  const allText = Object.entries(match.content).map(([k,v]) => `${k}\n${v}`).join('\n\n---\n\n');
  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = `
    <div class="result-header">
      <div class="result-tag">比對結果：${match.title}</div>
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAll(this)">全部複製</button>
    </div>
    ${Object.entries(match.content).map(([k,v], idx) => `
      <div class="result-block">
        <div class="block-header">
          <div class="block-title">${k}</div>
          <button class="copy-btn" onclick="copyBlock(this, 'blk-${idx}')">複製</button>
        </div>
        <div class="block-content" id="blk-${idx}">${escH(v)}</div>
      </div>
    `).join('')}
  `;
  document.getElementById('copyAllBtn').dataset.text = allText;
}
function copyAll(btn) {
  navigator.clipboard.writeText(btn.dataset.text).then(() => {
    btn.textContent = '已複製 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '全部複製'; btn.classList.remove('copied'); }, 2000);
  });
}
function copyBlock(btn, id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.textContent = '已複製 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
  });
}

      <span class="quiz-cat-count">${label}</span>
    </button>`;
  }).join('');
}

function startQuiz(catKey) {
  let questions;
  if (catKey === 'mixed') {
    questions = buildMixedQuiz();
  } else {
    questions = [...QUIZ_BANK[catKey].questions];
  }
  quizState = { catKey, questions, idx: 0, correct: 0, wrong: 0, answered: false };
  document.getElementById('quiz-intro').style.display = 'none';
  document.getElementById('quiz-active').style.display = 'block';
  document.getElementById('quiz-result').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const { questions, idx, correct, wrong } = quizState;
  const total = questions.length;
  const q = questions[idx];
  quizState.answered = false;

  // Progress
  document.getElementById('quizProgressBar').style.width = (idx / total * 100) + '%';
  document.getElementById('quizProgressText').textContent = `題目 ${idx + 1} / ${total}`;
  document.getElementById('quizScoreText').textContent = `✓ ${correct} &nbsp;✗ ${wrong}`;

  const letters = ['A', 'B', 'C', 'D'];
  document.getElementById('quizQuestionWrap').innerHTML = `
    <div class="quiz-question-card">
      <div class="quiz-q-head">
        <div class="quiz-q-badge">
          ${q.catName ? '🎲 ' + q.catName + ' · ' : ''}情境判斷
        </div>
        <div class="quiz-q-text">${q.q}</div>
        ${q.scenario ? `<div class="quiz-scenario">${q.scenario}</div>` : ''}
      </div>
      <div class="quiz-options">
        ${q.opts.map((opt, i) => `
          <button class="quiz-option" onclick="selectOption(${i})" id="opt-${i}">
            <span class="option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuestion()">
        ${idx + 1 < total ? '下一題 →' : '查看結果'}
      </button>
    </div>
  `;
}

function selectOption(chosen) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.idx];
  const isCorrect = chosen === q.ans;
  if (isCorrect) quizState.correct++; else quizState.wrong++;

  // Style options
  q.opts.forEach((_, i) => {
    const btn = document.getElementById('opt-' + i);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('reveal-correct');
    if (i === chosen && !isCorrect) btn.classList.add('selected-wrong');
  });
  if (isCorrect) document.getElementById('opt-' + chosen).classList.add('selected-correct');

  // Feedback
  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';
  fb.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
  const fbTitle = isCorrect ? '✅ 答對了！' : '❌ 答錯了';
  const fbBody = isCorrect ? q.fb.correct : (q.fb.wrong[chosen] || '這個答案不是最佳選項。');
  fb.innerHTML = `<div class="quiz-feedback-title">${fbTitle}</div><div class="quiz-feedback-body">${fbBody}</div>`;

  document.getElementById('quizNextBtn').style.display = 'block';
  document.getElementById('quizNextBtn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion() {
  quizState.idx++;
  if (quizState.idx >= quizState.questions.length) {
    showQuizResult();
  } else {
    renderQuestion();
    document.getElementById('quiz-active').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function showQuizResult() {
  document.getElementById('quiz-active').style.display = 'none';
  const resultEl = document.getElementById('quiz-result');
  resultEl.style.display = 'block';

  const { correct, wrong, questions, catKey } = quizState;
  const total = questions.length;
  const pct = Math.round(correct / total * 100);
  const circumference = 2 * Math.PI * 38;
  const offset = circumference * (1 - correct / total);

  let title, desc, color;
  if (pct >= 80) { title = '🏆 話術高手'; desc = '你對異議處理的直覺非常準確！繼續保持，下次可以挑戰更難的情境。'; color = '#27AE60'; }
  else if (pct >= 60) { title = '📈 進步中'; desc = '你掌握了基本方向，但細節上還有提升空間。建議複習你答錯的題目，想想每個選項背後的邏輯。'; color = '#E67E22'; }
  else { title = '💡 繼續加油'; desc = '異議處理是技術活，需要練習。智偉哥說：「失敗的對話比成功的更值得學習。」看看每題的詳細說明，找出自己的盲點。'; color = var_red; }

  resultEl.innerHTML = `
    <div class="quiz-result-card">
      <div class="quiz-score-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="#F0EDE8" stroke-width="6"/>
          <circle cx="45" cy="45" r="38" fill="none" stroke="${color}" stroke-width="6"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
        </svg>
        <div class="quiz-score-text">
          <span class="quiz-score-num">${pct}<span style="font-size:14px">%</span></span>
          <span class="quiz-score-denom">${correct}/${total}</span>
        </div>
      </div>
      <div class="quiz-result-title">${title}</div>
      <div class="quiz-result-desc">${desc}</div>
      <div class="quiz-result-meta">
        <div class="quiz-meta-item">
          <div class="quiz-meta-num green">${correct}</div>
          <div class="quiz-meta-label">答對</div>
        </div>
        <div class="quiz-meta-item">
          <div class="quiz-meta-num red">${wrong}</div>
          <div class="quiz-meta-label">答錯</div>
        </div>
        <div class="quiz-meta-item">
          <div class="quiz-meta-num" style="color:var(--text-sub)">${total}</div>
          <div class="quiz-meta-label">總題數</div>
        </div>
      </div>
      <div class="quiz-result-actions">
        <button class="quiz-retry-btn" onclick="startQuiz('${catKey}')">🔄 再練一次</button>
        <button class="quiz-new-btn" onclick="renderQuizIntro();document.getElementById('quiz-result').style.display='none';document.getElementById('quiz-intro').style.display='block'">換個情境</button>
      </div>
    </div>
  `;
}

const var_red = '#C0392B';

// ──────────────────────────────────────────
// CRM
// ──────────────────────────────────────────
const CRM_API_URL = 'https://script.google.com/macros/s/AKfycbxPExuVTXkz8ucGXscubiypyrWL_qqu53mlp8U_ggyz4kHUT1-bf29IVAFLEmlwnP85/exec';
let _crmCustomers = [];
function crmCall(payload, cb) {
  var tp = new Promise((_,rej) => setTimeout(()=>rej(new Error('連線逾時')),14000));
  var req = fetch(CRM_API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}).then(r=>r.json());
  Promise.race([req,tp]).then(cb).catch(e=>cb({success:false,error:e.message}));
}
function openCrmPicker() {
  document.getElementById('crmPickerBg').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  document.getElementById('crmSearchInput').value = '';
  const list = document.getElementById('crmPickerList');
  list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-dim);font-size:13px">⏳ 載入中...</div>';
  crmCall({action:'getAll',role:'manager',user:'ai_tool'}, function(res) {
    if (res.success && res.customers) {
      _crmCustomers = res.customers.filter(c => c.customerActive==='進行中' || !c.customerActive);
      renderCrmList(_crmCustomers);
    } else {
      list.innerHTML = '<div style="text-align:center;padding:32px;color:#c0392b;font-size:13px">❌ ' + (res.error||'無法連線 CRM') + '</div>';
    }
  });
}
function closeCrmPicker() {
  document.getElementById('crmPickerBg').style.display = 'none';
  document.body.style.overflow = '';
}
function filterCrmList() {
  const q = document.getElementById('crmSearchInput').value.trim().toLowerCase();
  renderCrmList(q ? _crmCustomers.filter(c=>(c.customerName||'').toLowerCase().includes(q)||(c.salesPerson||'').toLowerCase().includes(q)) : _crmCustomers);
}
function renderCrmList(list) {
  const el = document.getElementById('crmPickerList');
  if (!list.length) { el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-dim);font-size:13px">找不到客戶</div>'; return; }
  el.innerHTML = list.slice(0,80).map(c => {
    return `<div onclick='pickSosCustomer(${JSON.stringify(JSON.stringify(c))})' style="padding:10px 12px;border-radius:8px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border);background:#fff;transition:background .15s" onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background='#fff'">
      <div style="font-size:13px;font-weight:700;color:var(--text)">${c.customerName||'（無名稱）'}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px">${c.salesPerson||''}${c.blueprintCompletion?' ｜ '+c.blueprintCompletion:''}</div>
    </div>`;
  }).join('');
}
function pickSosCustomer(jsonStr) {
  const c = JSON.parse(jsonStr);
  closeCrmPicker();
  const objText = c.objections || c.whyNotBought || c.painPointsNote || '';
  if (objText) document.getElementById('objInput').value = objText;
  document.querySelectorAll('.ctx-pill').forEach(p => p.classList.remove('active'));
  selectedContexts = [];
  const seg = (c.clientSegment || c.clientType || '').toLowerCase();
  const pain = (c.painPointsNote || '').toLowerCase();
  const ctxMap = { '有股票':['股票'], '投資型客戶':['投資'], '首購族':['首購'], '父母反對':['媽媽','父母','反對'], '50歲以上':['50','退休'] };
  document.querySelectorAll('.ctx-pill').forEach(p => {
    const label = p.textContent.trim();
    const keys = ctxMap[label] || [label];
    if (keys.some(k => seg.includes(k) || pain.includes(k))) {
      p.classList.add('active');
      selectedContexts.push(label);
    }
  });
  const bar = document.getElementById('crmInfoBar');
  bar.style.display = 'block';
  bar.textContent = '👤 ' + c.customerName + '｜' + (c.salesPerson||'') + (c.blueprintCompletion ? '｜' + c.blueprintCompletion : '') + (objText ? '' : '（無異議記錄，請手動輸入）');
}

// ──────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────
function escH(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ──────────────────────────────────────────
// Init
// ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('objInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.metaKey) handleSOS();
  });
  try {
    var raw = sessionStorage.getItem('crm_launch_customer');
    if (!raw) return;
    sessionStorage.removeItem('crm_launch_customer');
    var c = JSON.parse(raw);
    pickSosCustomer(JSON.stringify(c));
  } catch(e) {}
});
</script>
