<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富時代｜異議話術 SOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96D;
    --gold-dim: #6B5520;
    --red: #C0392B;
    --dark: #0A0A0A;
    --dark-2: #111111;
    --dark-3: #181818;
    --dark-4: #202020;
    --text: #EAEAE2;
    --text-dim: #777770;
    --border: rgba(201,168,76,0.15);
    --border-bright: rgba(201,168,76,0.35);
    --green: #27AE60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .app { max-width: 700px; margin: 0 auto; padding: 28px 16px 80px; position: relative; }

  /* Header */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .sos-badge {
    background: var(--red); color: #fff;
    font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 15px;
    letter-spacing: 0.05em; padding: 6px 14px; border-radius: 4px; flex-shrink: 0;
  }
  .header-text h1 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 18px; letter-spacing: 0.06em; }
  .header-text p { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; margin-top: 2px; }

  /* Mode Tabs */
  .mode-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .mode-tab {
    flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--dark-3); color: var(--text-dim); font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px; cursor: pointer; text-align: center; transition: all 0.18s;
    letter-spacing: 0.05em;
  }
  .mode-tab:hover { border-color: var(--gold-dim); color: var(--text); }
  .mode-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
  .mode-tab .tab-icon { font-size: 16px; display: block; margin-bottom: 3px; }

  /* Section */
  .section-label { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

  /* Quick Grid */
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-bottom: 20px; }
  .quick-btn {
    padding: 10px 14px; background: var(--dark-3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-dim); font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px; text-align: left; cursor: pointer; transition: all 0.18s; line-height: 1.4;
  }
  .quick-btn:hover { border-color: var(--gold-dim); color: var(--text); background: var(--dark-4); }
  .quick-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }

  /* Input */
  .input-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .input-label span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.12em; }
  .pulse-dot { width: 7px; height: 7px; background: var(--red); border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  textarea {
    width: 100%; background: var(--dark-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; color: var(--text);
    font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 400;
    line-height: 1.6; resize: none; outline: none; transition: border-color 0.2s; min-height: 80px;
  }
  textarea:focus { border-color: var(--border-bright); }
  textarea::placeholder { color: var(--text-dim); font-size: 14px; }

  /* Context pills */
  .ctx-row { display: flex; gap: 7px; flex-wrap: wrap; margin: 12px 0 18px; }
  .ctx-pill {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px;
    background: transparent; color: var(--text-dim); font-size: 11px;
    font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
  }
  .ctx-pill:hover { border-color: var(--gold-dim); color: var(--text); }
  .ctx-pill.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }

  /* SOS Button */
  .sos-btn {
    width: 100%; padding: 16px; background: var(--red); border: none;
    border-radius: 10px; color: #fff; font-family: 'Noto Serif TC', serif;
    font-weight: 900; font-size: 16px; letter-spacing: 0.2em; cursor: pointer;
    transition: opacity 0.2s; margin-bottom: 24px;
  }
  .sos-btn:hover { opacity: 0.9; }
  .sos-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Result */
  .result-area { display: none; }
  .result-area.visible { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .result-tag { font-size: 11px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .result-tag::before { content:''; width:20px; height:1px; background:var(--gold); }

  .copy-all-btn {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--dark-4); color: var(--text-dim); font-size: 11px;
    font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s;
  }
  .copy-all-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .copy-all-btn.copied { color: var(--gold); border-color: var(--gold); }

  .result-block { background: var(--dark-2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .block-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--dark-3);
  }
  .block-title { font-size: 11px; color: var(--gold); letter-spacing: 0.12em; font-weight: 500; }
  .copy-btn {
    padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: transparent; color: var(--text-dim); font-size: 10px;
    font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .copy-btn.copied { color: var(--gold); border-color: var(--gold); }
  .block-content { padding: 14px 16px; font-size: 14px; line-height: 1.85; color: var(--text); white-space: pre-wrap; word-break: break-word; }

  /* Step indicators in content */
  .block-content strong { color: var(--gold-light); font-weight: 500; }

  .loading-wrap { display: flex; align-items: center; gap: 10px; padding: 28px 16px; color: var(--text-dim); font-size: 13px; letter-spacing: 0.08em; }
  .spinner { width: 16px; height: 16px; border: 1.5px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 20px 0; }

  /* Browse mode */
  .browse-list { display: flex; flex-direction: column; gap: 6px; }
  .browse-item {
    padding: 14px 16px; background: var(--dark-3); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: all 0.18s;
  }
  .browse-item:hover { border-color: var(--gold-dim); background: var(--dark-4); }
  .browse-item.open { border-color: var(--gold); }
  .browse-item-title { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 2px; }
  .browse-item-sub { font-size: 11px; color: var(--text-dim); }
  .browse-content { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .browse-content.open { display: block; }
  .browse-section { margin-bottom: 14px; }
  .browse-section-title { font-size: 10px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; margin-bottom: 7px; }
  .browse-section-body { font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }

  @media (max-width: 500px) { .quick-grid { grid-template-columns: 1fr; } .mode-tabs { flex-direction: row; } }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="sos-badge">SOS</div>
    <div class="header-text">
      <h1>異議話術救援</h1>
      <p>RICHTIMES · OBJECTION HANDLER · 智偉哥話術庫</p>
    </div>
  </header>

  <!-- Mode -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('search', this)">
      <span class="tab-icon">🔍</span>即時查詢
    </button>
    <button class="mode-tab" onclick="switchMode('browse', this)">
      <span class="tab-icon">📚</span>完整話術庫
    </button>
  </div>

  <!-- SEARCH MODE -->
  <div id="searchMode">
    <div class="section-label">常見異議快選</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="quickSelect(this, '我再想想看，晚點再決定')">我再想想</button>
      <button class="quick-btn" onclick="quickSelect(this, '現在房市不好，我等房價跌再買')">等房價跌</button>
      <button class="quick-btn" onclick="quickSelect(this, '我要問我媽媽/太太/先生意見')">要問家人</button>
      <button class="quick-btn" onclick="quickSelect(this, '我有股票不想動，覺得股票比較好')">有股票不動</button>
      <button class="quick-btn" onclick="quickSelect(this, '我手頭資金不夠，買不起')">資金不夠</button>
      <button class="quick-btn" onclick="quickSelect(this, '我擔心爛尾樓風險，預售屋不安全')">怕爛尾樓</button>
      <button class="quick-btn" onclick="quickSelect(this, '我喜歡大社區，這個案子太小了')">想要大社區</button>
      <button class="quick-btn" onclick="quickSelect(this, '建商一直蓋房子，是要蓋給誰住？供過於求吧')">供過於求</button>
      <button class="quick-btn" onclick="quickSelect(this, '空戶率這麼高，還適合買房嗎')">空戶率太高</button>
      <button class="quick-btn" onclick="quickSelect(this, '台灣房市會不會像日本一樣泡沫化')">怕泡沫化</button>
      <button class="quick-btn" onclick="quickSelect(this, '我很想買但還是很猶豫，一直沒辦法下決定')">想要又猶豫</button>
      <button class="quick-btn" onclick="quickSelect(this, '客戶已下訂但想退訂，說再考慮一下')">要退訂</button>
    </div>

    <div class="input-label">
      <div class="pulse-dot"></div>
      <span>輸入客戶原話（越完整越精準）</span>
    </div>
    <textarea id="objInput" placeholder="例如：「我股票還有200萬，想等賣掉再說，現在不想動」" rows="3"></textarea>

    <div class="section-label" style="margin-top:12px; margin-bottom:8px;">客戶背景</div>
    <div class="ctx-row">
      <button class="ctx-pill" onclick="toggleCtx(this,'有股票')">有股票</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'已婚')">已婚</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'首購族')">首購族</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'投資型客戶')">投資客</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'父母反對')">父母反對</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'租屋中')">租屋中</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'50歲以上')">50歲以上</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'外商/高薪')">外商高薪</button>
      <button class="ctx-pill" onclick="toggleCtx(this,'已下訂但猶豫')">已下訂</button>
    </div>

    <div class="divider"></div>
    <button class="sos-btn" id="sosBtn" onclick="handleSOS()">▶ 立即救援</button>
    <div class="result-area" id="resultArea"></div>
  </div>

  <!-- BROWSE MODE -->
  <div id="browseMode" style="display:none;">
    <div class="section-label">點擊展開完整話術</div>
    <div class="browse-list" id="browseList"></div>
  </div>

</div>

<script>
// ─── 話術資料庫（從 Notion 全部整合）─────────────────────────────
const DB = [
  {
    id: 'reconsider',
    title: '我再想想 / 晚一點再說',
    sub: '最常見拖延型異議',
    quick: ['30秒回應', '深度引導', '追問句'],
    content: {
      '⚡ 30秒回應': `「好，我尊重你的節奏。但我想先了解一下——你現在在思考的，主要是資金的問題、家人的問題，還是對這個物件本身有什麼疑慮？」

（等他回答，把模糊的「再想想」具體化）`,

      '🎯 深度引導': `想是問題，做是答案。

很多人說「再想想」，其實不是在想，是在等一個讓自己安心的理由。問題是，那個理由通常不會自己出現，要有人幫你把它找出來。

你今天猶豫的那個東西，三個月後可能就是別人的。我不是在催你，但我需要幫你把那個卡住的點解決掉——那才是真的在幫你。

【智偉哥核心邏輯】
不是讓客戶「決定要買」，而是幫他「決定要不要解決那個卡住的點」。
把「要不要買」變成「你的疑慮是什麼」——這才是對話的方向。`,

      '🔁 追問句': `「你說再想想，是還有什麼地方讓你不放心嗎？」
「如果今天這些問題都解決了，你覺得你會動嗎？」
「你最擔心的那一件事是什麼？讓我幫你把它搞清楚。」`
    }
  },
  {
    id: 'wait_drop',
    title: '等房價跌再買 / 現在房市不好',
    sub: '市場觀望型異議',
    content: {
      '⚡ 30秒回應': `「等跌的心情我完全理解。但我想問你一個問題——你等了多久了？」

（讓他自己說出等待時間，通常已經等了很久）`,

      '🎯 深度引導': `房地產最大的風險，不是買貴，是沒買。

在台灣等房價跌的人，等了10年、15年還在等。因為政府、建商、銀行都不希望房價崩。房價會修正，但不會崩。

【銀行估價邏輯教客戶】
市價1000萬 → 銀行估900萬 → 貸款720萬。
銀行不是笨蛋，他們有專業估價師和數據依據。銀行願意貸給你，代表他們認為這個資產至少值這個價。你覺得你比銀行更懂房市嗎？

【空戶率的反駁】
空戶率數字裡包含危老改建中、流程跑中的空房。而且——如果你是自住需求，為什麼還期待房價下修？期待下修代表不是真的自住。

就像台積電跌下來，你真的敢買嗎？真的下跌時，反而更多人不敢進場。`,

      '🔁 追問句': `「你覺得要跌到多少，你才會出手？」
「如果房價沒有跌，你的計畫是什麼？」
「你是自住需求還是投資需求？（自住不需要等跌）」`
    }
  },
  {
    id: 'family',
    title: '要問媽媽 / 要問太太先生',
    sub: '家人反對型異議——完整五題結構',
    content: {
      '⚡ 30秒回應': `「家人有意見，說明他們在乎你。但我想先了解一下——他們是實際上會出錢幫你，還是精神上給你建議？」

（把家人從「情緒角色」轉成「資源角色」，馬上定性他們的角色）`,

      '🎯 五題引導結構（智偉哥版）': `Q1｜先確認她自己想不想要
「對你來說，買這間房最重要的原因是什麼？是想有自己的家、穩定生活，還是你真的很喜歡？」
→ 目的：先確認她自己想要，不然後面全都不用談

Q2｜把反對翻譯成具體風險
「如果站在媽媽的角度，你覺得她最擔心的是哪一件事？收入穩不穩定？工作會不會變動？還是繳不起房貸？」
→ 目的：把情緒反對 → 具體擔心

Q3｜點出金錢信心
「你覺得媽媽對你現在的賺錢、還款能力，是有信心的嗎？還是比較擔心你一個人扛會太辛苦？」
→ 讓他說出：不是討厭房子，是在擔心我

Q4｜區分教養vs恐懼
「如果今天你能讓媽媽確定每個月繳得起，你覺得她反對的力道會不會小很多？」

Q5｜釐清錢幫不幫（最關鍵）
「你覺得媽媽是願意在能力範圍內實際幫你，還是其實已經決定不出錢，只是用反對來表達？」
→ 如果她說「可能會幫」，繼續問：「那你覺得大概會幫到什麼程度？有談過數字嗎？」`,

      '⚠️ 顧問心法': `✅ 永遠站在「媽媽是擔心你」的框架，不要說「媽媽在刁難你」
✅ 讓客戶自己說出媽媽的顧慮，你不是挑撥，是幫他們把話說清楚
✅ 一旦確認媽媽只是「精神支持」不出錢，決定權就回到客戶自己

收尾金句：
「所以我們現在不是在討論媽媽喜不喜歡，而是在確認：這個決定是你一個人的，還是媽媽會實際陪你一起承擔。」`
    }
  },
  {
    id: 'stock',
    title: '有股票不想動 / 股票比較好',
    sub: '資產固著型異議——分外商型/一般型',
    content: {
      '⚡ 30秒回應': `「股票我懂，你捨不得動很正常。但我想問你——你現在的股票，是要拿來做什麼用的？最終要換成什麼？」`,

      '🎯 一般型客戶話術': `股票賺的是機會，房子賺的是時間。機會會跑，時間不會跑。

【四層引導問題】
第一層｜讓他承認不安：
「你股票部位裡面，有沒有哪一筆，是你其實會有點不安心的？」

第二層｜拉長時間製造風險：
「如果這筆錢，接下來五年都還是放在股票，你覺得最壞的狀況會是什麼？」
（讓他自己說出風險，不是你說）

第三層｜定義房地產的角色：
「如果今天有一個資產，不是用來拚報酬，而是用來把這筆錢鎖住，你覺得對你來說有沒有價值？」

第四層｜讓他說比例：
「如果不是全部，你覺得多少比例放在一個你不用天天看盤、但五年後一定還在的資產，你會比較安心？」
（比例讓他說，不是你給）

【航運股案例】
2021年航運股帳面2400萬，沒轉移，最後跌到1100萬，蒸發1300萬。
如果當時轉1300萬買新北市電梯大樓，月租6萬，到現在已持續收租。`,

      '🎯 外商/高薪型客戶話術': `外商型客戶不怕大數字，他真正想的是「把我的戰力放大」。

Step 1｜先承認他的做法沒有錯：
「你現在用股票、用大盤，對你這種外商背景來說，其實是很標準也很聰明的做法。」

Step 2｜問天花板：
「但我想問你，你現在這套方式，五年後的上限在哪裡？」

Step 3｜定義房地產為槓桿器：

// ─── State ───────────────────────────────────────────────────────
let currentMode = 'search';
let selectedContexts = [];

// ─── Init browse ─────────────────────────────────────────────────
function initBrowse() {
  const list = document.getElementById('browseList');
  list.innerHTML = DB.map(item => `
    <div class="browse-item" id="browse-${item.id}" onclick="toggleBrowse('${item.id}')">
      <div class="browse-item-title">${item.title}</div>
      <div class="browse-item-sub">${item.sub}</div>
      <div class="browse-content" id="bc-${item.id}">
        ${Object.entries(item.content).map(([k,v]) => `
          <div class="browse-section">
            <div class="browse-section-title">${k}</div>
            <div class="browse-section-body">${escH(v)}</div>
          </div>
        `).join('')}
        <button class="copy-btn" style="margin-top:4px;" onclick="copyBrowse(event,'${item.id}')">複製全部話術</button>
      </div>
    </div>
  `).join('');
}

function toggleBrowse(id) {
  const item = document.getElementById(`browse-${id}`);
  const content = document.getElementById(`bc-${id}`);
  const isOpen = content.classList.contains('open');
  // close all
  document.querySelectorAll('.browse-content').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.browse-item').forEach(el => el.classList.remove('open'));
  if (!isOpen) { content.classList.add('open'); item.classList.add('open'); }
}

function copyBrowse(e, id) {
  e.stopPropagation();
  const item = DB.find(d => d.id === id);
  if (!item) return;
  const text = Object.entries(item.content).map(([k,v]) => `${k}\n${v}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).then(() => {
    e.target.textContent = '已複製 ✓';
    setTimeout(() => { e.target.textContent = '複製全部話術'; }, 2000);
  });
}

// ─── Mode switch ─────────────────────────────────────────────────
function switchMode(mode, btn) {
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = mode;
  document.getElementById('searchMode').style.display = mode === 'search' ? 'block' : 'none';
  document.getElementById('browseMode').style.display = mode === 'browse' ? 'block' : 'none';
  if (mode === 'browse') initBrowse();
}

// ─── Quick select ─────────────────────────────────────────────────
function quickSelect(btn, text) {
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('objInput').value = text;
}

function toggleCtx(btn, ctx) {
  btn.classList.toggle('active');
  if (btn.classList.contains('active')) { if (!selectedContexts.includes(ctx)) selectedContexts.push(ctx); }
  else { selectedContexts = selectedContexts.filter(c => c !== ctx); }
}

// ─── SOS main ────────────────────────────────────────────────────
function handleSOS() {
  const input = document.getElementById('objInput').value.trim();
  if (!input) { document.getElementById('objInput').focus(); return; }

  const btn = document.getElementById('sosBtn');
  btn.disabled = true; btn.textContent = '⏳ 比對話術庫中...';

  const resultArea = document.getElementById('resultArea');
  resultArea.className = 'result-area visible';
  resultArea.innerHTML = `<div class="result-block"><div class="loading-wrap"><div class="spinner"></div>正在比對最符合的話術...</div></div>`;

  setTimeout(() => {
    const match = findBestMatch(input);
    renderResult(input, match);
    btn.disabled = false; btn.textContent = '▶ 立即救援';
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}

function findBestMatch(input) {
  const lower = input.toLowerCase();
  const scores = DB.map(item => {
    let score = 0;
    const keywords = {
      'reconsider': ['想想','考慮','等等','晚點','再說','再看','猶豫下不了決定','一直沒辦法'],
      'wait_drop': ['跌','房市不好','等房價','觀望','空戶','泡沫','供過','建商一直蓋'],
      'family': ['媽媽','太太','先生','家人','老公','老婆','父母','反對','要問'],
      'stock': ['股票','基金','不想動','股市'],
      'money': ['資金','不夠','買不起','錢','負擔','繳不起'],
      'rotten': ['爛尾','預售','不安全','信託','風險'],
      'bigcomplex': ['大社區','大樓','設備','游泳池','太小'],
      'oversupply': ['供過','建商蓋','蓋給誰住','供需'],
      'vacancy': ['空戶','沒人住','空屋'],
      'bubble': ['泡沫','日本','崩盤'],
      'hesitate': ['很想要','想要又','猶豫不決','下不了'],
      'refund': ['退訂','不買了','想退','取消']
    };
    const kws = keywords[item.id] || [];
    kws.forEach(kw => { if (lower.includes(kw)) score += 2; });
    // context bonus
    if (selectedContexts.includes('有股票') && item.id === 'stock') score += 3;
    if (selectedContexts.includes('父母反對') && item.id === 'family') score += 3;
    if (selectedContexts.includes('已下訂') && item.id === 'refund') score += 3;
    if (selectedContexts.includes('外商/高薪') && item.id === 'stock') score += 2;
    return { item, score };
  });

  scores.sort((a,b) => b.score - a.score);
  return scores[0].item;
}

function renderResult(query, match) {
  const allText = Object.entries(match.content).map(([k,v]) => `${k}\n${v}`).join('\n\n---\n\n');
  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = `
    <div class="result-header">
      <div class="result-tag">比對結果：${match.title}</div>
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAll(this)">全部複製</button>
    </div>
    ${Object.entries(match.content).map(([k,v], idx) => `
      <div class="result-block">
        <div class="block-header">
          <div class="block-title">${k}</div>
          <button class="copy-btn" onclick="copyBlock(this, 'blk-${idx}')">複製</button>
        </div>
        <div class="block-content" id="blk-${idx}">${escH(v)}</div>
      </div>
    `).join('')}
  `;
  document.getElementById('copyAllBtn').dataset.text = allText;
}

function copyAll(btn) {
  navigator.clipboard.writeText(btn.dataset.text).then(() => {
    btn.textContent = '已複製 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '全部複製'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyBlock(btn, id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.textContent = '已複製 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
  });
}

function escH(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Enter shortcut
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('objInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.metaKey) handleSOS();
  });
});
</script>
